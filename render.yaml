# VANGUARD — Blueprint de Render (plan GRATIS, sin tarjeta)
# Crea el servidor multijugador (Socket.io) con 1 clic:
#   Render > New + > Blueprint > selecciona el repo VANGUARD > Apply.
services:
  - type: web
    name: vanguard-games
    runtime: node
    plan: free
    rootDir: mini-services/game-service
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
