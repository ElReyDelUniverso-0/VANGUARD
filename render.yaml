# VANGUARD — Blueprint de Render (multijugador en tiempo real, plan FREE)
# Uso: render.com → New + → Blueprint → selecciona este repo → Apply
# Después copia la URL pública del servicio (https://…onrender.com) y ponla
# en Vercel como variable NEXT_PUBLIC_REALTIME_URL.
services:
  - type: web
    name: vanguard-multijugador
    runtime: bun
    plan: free
    rootDir: mini-services/game-service
    buildCommand: bun install
    startCommand: bun index.ts
    healthCheckPath: /health
