name: Cloudflare — construir y publicar la casa (Workers & Pages)

# LA MUDANZA A CLOUDFLARE: Vercel (plan Hobby) pausó la cuenta por pasar el
# límite de CPU. La casa se construye aquí con OpenNext (gratis: el repo es
# público) y se publica como Worker en Cloudflare con wrangler.
#
# Llaves que hacen falta (Settings → Secrets and variables → Actions):
#   secrets.CLOUDFLARE_API_TOKEN   token con permiso «Edit Cloudflare Workers»
#   secrets.CLOUDFLARE_ACCOUNT_ID  el Account ID de Cloudflare
#   vars.CF_SITE_URL               (opcional) la URL pública, p. ej.
#                                  https://vanguard.<subdominio>.workers.dev
# Sin el token el workflow solo CONSTRUYE (sirve de prueba) y no publica.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cloudflare-produccion
  cancel-in-progress: true

jobs:
  construir-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VANGUARD_CF: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=12288"
      NEXT_PUBLIC_SITE_URL: ${{ vars.CF_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Construir con OpenNext
        run: npx opennextjs-cloudflare build

      - name: Tamaño del Worker
        run: |
          du -sh .open-next/assets .open-next/server-functions 2>/dev/null || true
          npx wrangler deploy --dry-run --outdir /tmp/cfdry > /tmp/dry.log 2>&1 || tail -30 /tmp/dry.log
          grep -iE "Total Upload|gzip" /tmp/dry.log || true
          du -sh /tmp/cfdry 2>/dev/null || true

      - name: Publicar en Cloudflare
        if: ${{ env.HAY_TOKEN == 'true' }}
        env:
          HAY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
