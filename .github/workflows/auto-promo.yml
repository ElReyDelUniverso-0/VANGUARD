# VANGUARD — AGENTE AUTOMÁTICO DE PROMOCIÓN
# Corre SOLO cada 12 horas (05:00 y 17:00 hora Santo Domingo).
# Sin secretos: todos los canales de promoción son keyless (IndexNow/
# Ping-o-Matic/Twingly/WebSub/TotalPing). Cada corrida queda registrada
# aquí en Actions y sus enlaces usan ref=VGD-AGENT<run> para medir visitas
# en el ranking de /mision.
name: auto-promo

on:
  schedule:
    - cron: "0 9,21 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agente automático de promoción
        run: bash scripts/auto-promo.sh
