<style>

.x{cursor:pointer;color:var(--dim);font-size:18px;padding:2px 8px;border:1px solid var(--line);border-radius:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}

<script>
(function(){
'use strict';
/* ================= VANGUARD v69 FUSIÓN TOTAL — NÚCLEO ================= */
const $=(s,r)=> (r||document).querySelector(s);
const $$=(s,r)=> Array.from((r||document).querySelectorAll(s));
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const dist2=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const fmt=n=>{n=Math.round(n);return n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':''+n};
const now=()=>Date.now();
const esc=s=>(''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const IS_MOBILE=isTouch&&Math.min(innerWidth,innerHeight)<820;

/* ---------- CONFIG: pega claves opcionales aquí o en localStorage vg_keys ---------- */
const CFG=Object.assign({
  mapbox:'', elevenlabs:'', pexels:'', telegram:'', supabaseUrl:'', supabaseKey:'', firebase:''
},JSON.parse(localStorage.getItem('vg_keys')||'{}'));

/* ---------- PERFIL / GUARDADO ---------- */
const RANKS=['CIVIL','RECLUTA','ANALISTA','CORRESPONSAL','OPERATIVO','AGENTE ESPECIAL','DIRECTOR ADJUNTO','DIRECTOR DE INTELIGENCIA','LEYENDA','ORÁCULO'];
const RANK_XP=[0,100,250,500,900,1400,2000,2800,3800,5200];
const RANK_COLOR=['#8A93A6','#8A93A6','#00FF87','#00FF87','#1E90FF','#1E90FF','#B26BFF','#B26BFF','#FFC24B','#FFC24B'];
function defaultProfile(){return{
  v:68, code:'', gender:'m', suit:0, skin:2, hair:0,
  coins:0, xp:0, rank:0,
  cards:[], files:[], recruits:[], skills:{},
  streak:0, lastEnvelopeDay:0, lastSeen:0,
  tension:44, pacRep:0, analystRep:0, karma:0,
  foundersN:0, morseHits:0, omega:false, island:false,
  konami:false, arcadeUsed:0, missionDone:0, hackWins:0, duelWins:0,
  bestSniper:0, bestTactic:false, marketNet:0, totalEarned:0, created:now()
};}
let P;
try{P=Object.assign(defaultProfile(),JSON.parse(localStorage.getItem('vg_nexo_v1')||'{}'));}catch(e){P=defaultProfile();}
if(!P.code)P.code='';
let saveT=null,cloudDirty=false;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('vg_nexo_v1',JSON.stringify(P));}catch(e){}},600);}

/* ---------- ECONOMÍA ---------- */
let protocoloUntil=Number(localStorage.getItem('vg_protocolo')||0);
function protocoloActive(){return now()<protocoloUntil;}
function skillMult(){const n=Object.values(P.skills||{}).reduce((a,b)=>a+(b||0),0);return 1+n*0.05;}
function addCoins(n,why){
  if(n>0){let m=1;if(protocoloActive())m*=2;
    m*=skillMult('analista');
    if(P.recruits.some(r=>r.spec==='ECO'))m*=1.05;
    n=Math.round(n*m);
    P.totalEarned+=n;
    if(m>1&&why)toast('MULTIPLICADOR','+'+n+' C\u20AC2 (x'+m.toFixed(1)+' activo)','gold');
  }
  P.coins=Math.max(0,Math.round(P.coins+n));
  $('#coinsN').textContent=fmt(P.coins);
  if(n>0)FX.coinBurst(irnd(6,14));
  save();return n;
}
function addXP(n){
  P.xp+=n;
  let up=false;
  while(P.rank<9&&P.xp>=RANK_XP[P.rank+1]){P.rank++;up=true;}
  if(up){
    const bonus=100*P.rank;P.coins+=bonus;
    toast('ASCENSO','\u00A1'+RANKS[P.rank]+'! Bonus +'+bonus+' C\u20AC2','gold',5200);
    SFX.fanfare();Flash.ring();
    Hangar.celebrate&&Hangar.celebrate();
    pushFeed('HAS SIDO ASCENDIDO A '+RANKS[P.rank],'y');
  }
  refreshHUD();save();
}
function xpPct(){
  const a=RANK_XP[P.rank],b=P.rank<9?RANK_XP[P.rank+1]:a+2000;
  return clamp((P.xp-a)/(b-a)*100,0,100);
}
function refreshHUD(){
  $('#coinsN').textContent=fmt(P.coins);
  $('#rankTag').textContent=RANKS[P.rank];
  $('#rankTag').style.color=RANK_COLOR[P.rank];
  $('#xpBar i').style.width=xpPct()+'%';
  $('#xpLab').textContent='XP '+fmt(P.xp);
  $('#rachaN').textContent=P.streak;
  const t=Math.round(World.tension);
  $('#thermoN').textContent=t;
  $('#thermo i').style.width=t+'%';
  document.body.classList.toggle('t-hot',t>=55&&t<80);
  document.body.classList.toggle('t-crisis',t>=80&&t<90);
  document.body.classList.toggle('t-rojo',t>=90);
  const hb=World.heartbeatMs();
  $('#hbIcon').style.setProperty('--hb',hb+'ms');
}
const IC='\u20AC2'; /* símbolo moneda ⓒ */

/* ---------- TOASTS / MODAL / FLASH ---------- */
function toast(t1,t2,kind,ms){
  const d=document.createElement('div');d.className='toast '+(kind||'');
  d.innerHTML='<div class="t1">'+esc(t1)+'</div><div>'+t2+'</div>';
  $('#toasts').appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .4s';setTimeout(()=>d.remove(),450);},ms||3600);
}
let modalOnClose=null;
function openModal(title,html,onClose){
  $('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;
  $('#modalWrap').classList.add('on');modalOnClose=onClose||null;
}
function closeModal(){if(!$('#modalWrap').classList.contains('on'))return;$('#modalWrap').classList.remove('on');if(modalOnClose){modalOnClose();modalOnClose=null;}}
const Flash={
  f:$('#flash'),
  white(o,ms){this.f.style.background='#fff';this.f.style.opacity=o||.5;setTimeout(()=>this.f.style.opacity=0,ms||110);},
  red(o,ms){this.f.style.background='#FF3B30';this.f.style.opacity=o||.4;setTimeout(()=>this.f.style.opacity=0,ms||160);},
  ring(){this.white(.25,90);setTimeout(()=>FX.rings(innerWidth/2,innerHeight/2,1),60);}
};
function vibrate(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}

/* ---------- TENSION + LATIDO DEL MUNDO (sistema 21) ---------- */
const World={
  tension:clamp(P.tension,10,96),
  lastDrift:now(),
  bump(v,why){
    const prev=this.tension;this.tension=clamp(this.tension+v,5,99);
    if(why&&Math.abs(v)>=1)toast('TENSI\u00D3N MUNDIAL',(v>0?'+':'')+v.toFixed(1)+' \u00B7 '+why,v>0?'bad':'good',2600);
    if(prev<80&&this.tension>=80){SFX.alarm();toast('MODO CRISIS','Tensi\u00F3n >80: el mundo late en rojo','bad',5000);pushFeed('MODO CRISIS ACTIVADO \u2014 tensi\u00F3n global '+Math.round(this.tension),'r');}
    if(prev<90&&this.tension>=90){SFX.siren();toast('PROTOCOLO ROJO','Toda la interfaz late. Act\u00FAa.','bad',6000);}
    P.tension=this.tension;refreshHUD();
  },
  heartbeatMs(){const t=this.tension;return Math.round(lerp(1300,360,clamp((t-10)/85,0,1)));},
  beatAcc:0, beatN:0,
  update(dt){
    if(now()-this.lastDrift>60000){this.lastDrift=now();this.tension+=(this.tension<70?rnd(.5,2):rnd(-2,.5));this.tension=clamp(this.tension,10,96);P.tension=this.tension;refreshHUD();save();}
    this.beatAcc+=dt*1000;
    const ms=this.heartbeatMs();
    if(this.beatAcc>=ms){
      this.beatAcc=0;this.beatN++;
      const t=this.tension;
      const vol=lerp(.06,.5,clamp((t-10)/85,0,1));
      SFX.heart(vol,t>=80);
      $('#vig').style.opacity=Math.min(1,.25+(t/100)*.75);
      if(t>=90)document.body.animate([{filter:'brightness(1)'},{filter:'brightness(1.25) saturate(1.4)'},{filter:'brightness(1)'}],{duration:ms*.8});
    }
  }
};

/* ---------- DATOS REALES (mismas APIs del sitio + APIs abiertas) ---------- */
const DATA={news:[],quakes:[],pulso:null,countries:[],iss:null,online:1,peak:0,health:null,loaded:false};
async function jget(url,ms){
  try{const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||9000);
    const r=await fetch(url,{signal:c.signal,cache:'no-store'});clearTimeout(t);
    if(!r.ok)throw 0;return await r.json();
  }catch(e){return null;}
}
async function loadNews(){
  const j=await jget('/api/news');
  if(j&&Array.isArray(j.items)&&j.items.length){DATA.news=j.items.slice(0,14);}
  else DATA.news=simNews();
  buildTicker();
}

  const j=await jget('/api/earthquakes');
  if(j&&Array.isArray(j.quakes))DATA.quakes=j.quakes.slice(0,12);
  else DATA.quakes=[];
}
async function loadPulso(){
  const j=await jget('/api/pulso');
  if(j){DATA.pulso=j;if(j.iss)DATA.iss=j.iss;}
}

  const j=await jget('https://restcountries.com/v3.1/all?fields=name,cca2,latlng,region,population,translations,capital,currencies',12000);
  if(Array.isArray(j)&&j.length>50){
    DATA.countries=j.map(c=>({n:(c.translations&&c.translations.spa&&c.translations.spa.common)||c.name.common,nEn:c.name.common,c2:c.cca2,lat:c.latlng&&c.latlng[0],lng:c.latlng&&c.latlng[1],reg:c.region,pop:c.population,cap:c.capital&&c.capital[0],cur:c.currencies?Object.keys(c.currencies)[0]:null}));
  }else DATA.countries=FALLBACK_COUNTRIES;
}
async function loadPresence(){
  const j=await jget('/api/presence');
  if(j&&j.ok){DATA.online=Math.max(1,j.online);DATA.peak=j.peak||DATA.peak;
    $('#onlineN').textContent=DATA.online;
    const pt=$('#peakTag');pt.style.display='';pt.textContent='R\u00C9CORD '+DATA.peak;
  }
  const h=await jget('/api/health');
  if(h&&h.ok){DATA.health=h;$('#verTag').textContent=h.version||'v69';}
}
function simNews(){
  const T=['Escalada militar en el mar Rojo: los portaaviones cambian de posici\u00F3n','Cumbre de emergencia por la crisis energ\u00E9tica europea','Ciberataque masivo derriba servidores de una agencia gubernamental','Nuevas sanciones comerciales entraron en vigor esta madrugada','Cese el fuego fr\u00E1gil: observadores reportan disparos aislados','R\u00E9cord de refugiados cruzando la frontera sur','Maniobras navales sin precedentes cerca de aguas disputadas','Filtraci\u00F3n: documento clasificado describe un programa satelital secreto'];

}
const FALLBACK_COUNTRIES=[
 {n:'Ucrania',nEn:'Ukraine',c2:'UA',lat:49,lng:32,reg:'Europe',pop:44000000},
 {n:'Rusia',nEn:'Russia',c2:'RU',lat:61,lng:90,reg:'Europe',pop:144000000},
 {n:'Israel',nEn:'Israel',c2:'IL',lat:31.5,lng:34.9,reg:'Asia',pop:9500000},
 {n:'Palestina',nEn:'Palestine',c2:'PS',lat:31.9,lng:35.2,reg:'Asia',pop:5300000},
 {n:'Sud\u00E1n',nEn:'Sudan',c2:'SD',lat:15,lng:30,reg:'Africa',pop:47000000},
 {n:'Taiw\u00E1n',nEn:'Taiwan',c2:'TW',lat:23.7,lng:121,reg:'Asia',pop:23000000},
 {n:'Corea del Norte',nEn:'North Korea',c2:'KP',lat:40,lng:127,reg:'Asia',pop:26000000},
 {n:'Ir\u00E1n',nEn:'Iran',c2:'IR',lat:32,lng:53,reg:'Asia',pop:88000000},
 {n:'Venezuela',nEn:'Venezuela',c2:'VE',lat:8,lng:-66,reg:'South America',pop:28000000},
 {n:'Estados Unidos',nEn:'United States',c2:'US',lat:39,lng:-98,reg:'Americas',pop:335000000},
 {n:'China',nEn:'China',c2:'CN',lat:35,lng:105,reg:'Asia',pop:1412000000},
 {n:'India',nEn:'India',c2:'IN',lat:21,lng:78,reg:'Asia',pop:1428000000},

/* ================= AUDIO PROCEDURAL (WebAudio + Howler) ================= */
const SFX=(function(){
  let ctx=null,master=null,comp=null,noiseBuf=null,started=false,muted=false;
  let staticSrc=null,staticGain=null,staticFilter=null;
  function ensure(){
    if(started)return true;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      comp=ctx.createDynamicsCompressor();
      master=ctx.createGain();master.gain.value=.9;
      master.connect(comp);comp.connect(ctx.destination);
      const len=ctx.sampleRate*2,b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      noiseBuf=b;started=true;
      if(window.Howler)Howler.volume(.9);
      return true;
    }catch(e){return false;}
  }
  function resume(){if(!ensure())return;if(ctx.state==='suspended')ctx.resume();}
  function out(pos){ /* pos: THREE.Vector3 opcional -> posicional */
    if(!started)return null;
    if(pos&&ctx.createPanner&&ThreeEng.ready()){
      const p=ctx.createPanner();p.panningModel='equalpower';p.distanceModel='linear';
      p.refDistance=2;p.maxDistance=40;p.rolloffFactor=1.4;
      p.setPosition(pos.x||0,pos.y||0,pos.z||0);p.connect(master);return p;
    }
    return master;
  }
  function env(g,t0,a,peak,dec){g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+a+dec);}
  function tone(freq,dur,type,vol,dest,slide,dt){
    if(!started||muted)return;
    const t0=ctx.currentTime+(dt||0);
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t0+dur);
    env(g,t0,0.004,vol||.2,dur);
    o.connect(g);g.connect(dest||master);o.start(t0);o.stop(t0+dur+.05);
  }
  function noise(dur,vol,fType,fFreq,fQ,dest,dt,slideF){
    if(!started||muted)return;
    const t0=ctx.currentTime+(dt||0);
    const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    const f=ctx.createBiquadFilter();f.type=fType||'bandpass';f.frequency.setValueAtTime(fFreq||1000,t0);f.Q.value=fQ||1;
    if(slideF)f.frequency.exponentialRampToValueAtTime(Math.max(30,slideF),t0+dur);
    const g=ctx.createGain();env(g,t0,0.005,vol||.2,dur);
    s.connect(f);f.connect(g);g.connect(dest||master);s.start(t0);s.stop(t0+dur+.05);
  }
  const S={};
  S.resume=resume;
  S.muteToggle=function(){muted=!muted;if(window.Howler)Howler.volume(muted?0:.9);if(master)master.gain.value=muted?0:.9;return muted;};
  S.muted=()=>muted;
  /* pasos por material (metal | vidrio | alfombra | hormigon) */
  S.step=function(mat,pos){
    if(!started||muted)return;const dst=out(pos);
    if(mat==='metal'){tone(1500+rnd(-150,300),.09,'triangle',.12,dst);noise(.05,.1,'bandpass',2400,4,dst);}
    else if(mat==='vidrio'){tone(2900+rnd(-200,500),.07,'sine',.09,dst);noise(.04,.06,'highpass',3000,1,dst);}

  S.engineStart=function(){if(!started||muted||S._eng)return;S._eng=ctx.createOscillator();S._engG=ctx.createGain();

  S.staticStop=function(){if(staticSrc){try{staticSrc.stop();}catch(e){}staticSrc=null;staticGain=null;}};
  S.tts=function(text){ /* ElevenLabs si hay clave; si no, voz del navegador */

const Mic={on:false,level:0,stream:null,analyser:null,buf:null,
  async start(){
    if(this.on)return true;
    try{
      this.stream=await navigator.mediaDevices.getUserMedia({audio:true});
      if(!SFX.resume()){}
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      const src=ctx.createMediaStreamSource(this.stream);
      this.analyser=ctx.createAnalyser();this.analyser.fftSize=512;
      this.buf=new Uint8Array(this.analyser.frequencyBinCount);
      src.connect(this.analyser);this._ctx=ctx;this.on=true;return true;
    }catch(e){toast('MICR\u00D3FONO','Permiso denegado. Usa el cursor para soplar.','bad');return false;}
  },
  stop(){if(this.stream){this.stream.getTracks().forEach(t=>t.stop());}if(this._ctx)try{this._ctx.close();}catch(e){}this.on=false;this.level=0;},
  update(){if(!this.on)return;this.analyser.getByteTimeDomainData(this.buf);
    let s=0;for(let i=0;i<this.buf.length;i++){const v=(this.buf[i]-128)/128;s+=v*v;}
    this.level=clamp(Math.sqrt(s/this.buf.length)*6,0,1);}
};

const joyEl=$('#joy'),joyKnob=$('#joyKnob');
function joyShow(x,y){joyEl.style.display='block';joyEl.style.left=(x-60)+'px';joyEl.style.top=(y-60)+'px';Joy.bx=x;Joy.by=y;Joy.active=true;}
function joyMove(x,y){let dx=x-Joy.bx,dy=y-Joy.by;const d=Math.hypot(dx,dy);
  if(d>52){dx=dx/d*52;dy=dy/d*52;}
  Joy.dx=dx/52;Joy.dy=dy/52;Joy.mag=Math.min(1,d/52);
  joyKnob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;}

let longPressTimer=null,activeTouches=new Map();

window.addEventListener('pointerdown',e=>{
  Pointer.justDown=true;Pointer.down=true;Pointer.downX=e.clientX;Pointer.downY=e.clientY;
  Pointer.moved=0;Pointer.downT=now();Pointer.longPress=false;Pointer.touch=e.pointerType==='touch';
  activeTouches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(e.pointerType==='touch'&&activeTouches.size===2){
    const p=Array.from(activeTouches.values());
    Pinch.active=true;Pinch.dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);Pinch.delta=0;
    if(Joy.active&&Joy.id!==e.pointerId){} 
  }
  if(e.pointerType==='touch'&&Joy.enabled&&!Joy.active&&activeTouches.size<3&&!isUI(e.target)){
    Joy.id=e.pointerId;joyShow(e.clientX,e.clientY);
  }
  if(!isUI(e.target)){
    clearTimeout(longPressTimer);
    longPressTimer=setTimeout(()=>{
      if(Pointer.down&&Pointer.moved<14&&now()-Pointer.downT>340){
        Pointer.longPress=true;
        if(activeRoom&&activeRoom.onLongPress)try{activeRoom.onLongPress(Pointer.x,Pointer.y);}catch(err){}
      }
    },380);
  }
},{passive:true});
window.addEventListener('pointermove',e=>{
  Pointer.px=Pointer.x;Pointer.py=Pointer.y;
  Pointer.x=e.clientX;Pointer.y=e.clientY;
  Pointer.dx=Pointer.x-Pointer.px;Pointer.dy=Pointer.y-Pointer.py;
  Pointer.vx=Pointer.vx*.8+Pointer.dx*.2;Pointer.vy=Pointer.vy*.8+Pointer.dy*.2;
  Pointer.speed=Math.hypot(Pointer.vx,Pointer.vy);
  if(Pointer.down)Pointer.moved+=Math.hypot(Pointer.dx,Pointer.dy);
  if(activeTouches.has(e.pointerId))activeTouches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(Pinch.active&&activeTouches.size===2){
    const p=Array.from(activeTouches.values());
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    Pinch.delta=d/Pinch.dist;Pinch.dist=d;
  }
  if(Joy.active&&e.pointerId===Joy.id)joyMove(e.clientX,e.clientY);
  if(activeRoom&&activeRoom.onPointerMove)try{activeRoom.onPointerMove(e);}catch(err){}
},{passive:true});
function endPointer(e){
  Pointer.justUp=true;Pointer.down=false;
  activeTouches.delete(e.pointerId);
  if(activeTouches.size<2)Pinch.active=false;
  clearTimeout(longPressTimer);
  if(e.pointerId===Joy.id)joyHide();
  if(activeRoom&&activeRoom.onPointerUp)try{activeRoom.onPointerUp(e);}catch(err){}
}
window.addEventListener('pointerup',endPointer,{passive:true});

/* ================= FX 2D: PART\u00CDCULAS, SHAKE, CONFETI, C\u00D3DIGO ================= */
const FX=(function(){
  const cv=$('#fx2d'),ctx=cv.getContext('2d');
  let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
  let parts=[],lowQ=false;
  function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
    cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
  resize();window.addEventListener('resize',resize);
  function add(p){if(lowQ&&parts.length>140)return;parts.push(p);}
  const API={
    lowQuality(){lowQ=true;},
    dust(x,y,n,spread){for(let i=0;i<(n||8);i++)add({t:'dust',x:x+rnd(-6,6),y:y+rnd(-3,3),vx:rnd(-40,40)*(spread||1),vy:rnd(-30,-4),life:0,max:rnd(.5,1),s:rnd(2,5),c:'rgba(180,190,210,'});},
    sparks(x,y,n,color){for(let i=0;i<(n||14);i++){const a=rnd(0,Math.PI*2),v=rnd(60,320);add({t:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,life:0,max:rnd(.3,.9),s:rnd(1,3),c:color||'0,255,135'});}},
    confetti(n){const cols=['#1E90FF','#00FF87','#FFC24B','#FF3B30','#B26BFF','#F0F0F0'];
      for(let i=0;i<(n||80);i++)add({t:'conf',x:rnd(0,W),y:rnd(-H*.3,0),vx:rnd(-40,40),vy:rnd(60,240),life:0,max:rnd(1.6,3),s:rnd(3,7),c:pick(cols),rot:rnd(0,6),vr:rnd(-6,6)});},
    rings(x,y,scale,n){for(let i=0;i<(n||3);i++)add({t:'ring',x,y,r:6,life:0,max:.9+i*.25,s:(scale||1)*(1+i*.4),c:'30,144,255'});},
    ink(x,y){for(let i=0;i<10;i++)add({t:'ink',x:x+rnd(-30,30),y:y+rnd(-20,20),r:rnd(8,26),life:0,max:rnd(.8,1.6),s:0,c:'255,59,48'});},
    coinBurst(n){const r=$('#coinsN').getBoundingClientRect();const x=r.left+r.width/2,y=r.top+r.height/2;
      for(let i=0;i<(n||10);i++){const a=rnd(-2.6,-0.5),v=rnd(90,260);add({t:'coin',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:rnd(.5,1),s:rnd(2.5,5),c:'255,194,75'});}},
    firework(x,y,cols){const c=cols||['255,194,75','30,144,255','0,255,135','255,255,255'];
      for(let i=0;i<46;i++){const a=rnd(0,Math.PI*2),v=rnd(80,300);add({t:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:rnd(.6,1.3),s:rnd(1.5,3),c:pick(c),grav:120});}},
    codeRain(sec){this._rainUntil=now()+(sec||3)*1000;},
    _rainUntil:0,
    update(dt){
      ctx.clearRect(0,0,W,H);
      if(now()<this._rainUntil&&Math.random()<.5){
        const x=rnd(0,W);add({t:'code',x,y:-20,vy:rnd(300,700),life:0,max:2,s:rnd(10,14),ch:pick(['0','1','{','}','<','>','$','#','*','+']),c:'0,255,135'});
      }
      for(let i=parts.length-1;i>=0;i--){
        const p=parts[i];p.life+=dt;
        if(p.life>=p.max){parts.splice(i,1);continue;}
        const k=1-p.life/p.max;
        if(p.t==='dust'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=60*dt;ctx.fillStyle=p.c+(.5*k)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.s*(1+p.life),0,7);ctx.fill();}
        else if(p.t==='spark'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.grav||220)*dt;ctx.globalCompositeOperation='lighter';
          ctx.strokeStyle='rgba('+p.c+','+k+')';ctx.lineWidth=p.s;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);ctx.stroke();
          ctx.globalCompositeOperation='source-over';}
        else if(p.t==='conf'){p.x+=p.vx*dt+Math.sin(p.life*8)*30*dt;p.y+=p.vy*dt;p.vy+=40*dt;p.rot+=p.vr*dt;
          ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=k;ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();ctx.globalAlpha=1;}
        else if(p.t==='ring'){const rr=p.r+p.life/p.max*160*p.s;ctx.strokeStyle='rgba('+p.c+','+(.7*k)+')';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(p.x,p.y,rr,0,7);ctx.stroke();}
        else if(p.t==='ink'){const rr=p.r+p.life/p.max*34;ctx.fillStyle='rgba('+p.c+','+(.8*k)+')';ctx.beginPath();ctx.arc(p.x,p.y,rr,0,7);ctx.fill();}
        else if(p.t==='coin'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;if(p.y>H-30){p.y=H-30;p.vy*=-.5;}
          ctx.fillStyle='rgba('+p.c+','+k+')';ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();
          ctx.fillStyle='rgba(255,255,255,'+(k*.9)+')';ctx.beginPath();ctx.arc(p.x-p.s*.3,p.y-p.s*.3,p.s*.3,0,7);ctx.fill();}
        else if(p.t==='code'){p.y+=p.vy*dt;ctx.fillStyle='rgba('+p.c+','+k+')';ctx.font=p.s+'px JetBrains Mono';ctx.fillText(p.ch,p.x,p.y);
          if(Math.random()<.2)p.ch=pick(['0','1','{','}','<','>','$','#','*','+']);}
      }
    }
  };
  Loop.add(dt=>API.update(dt));
  return API;
})();
const Shake={t:0,mag:0,
  add(m,ms){this.mag=Math.max(this.mag,m);this.t=Math.max(this.t,(ms||300)/1000);},
  update(dt){if(this.t>0){this.t-=dt;if(this.t<=0)this.mag=0;}},
  ox(){return this.mag?rnd(-this.mag,this.mag):0;},
  oy(){return this.mag?rnd(-this.mag,this.mag):0;}
};

function typeText(el,text,cps,done){
  el.textContent='';let i=0;const iv=setInterval(()=>{
    el.textContent=text.slice(0,++i);
    if(i%2===0)SFX.type();
    if(i>=text.length){clearInterval(iv);done&&done();}
  },1000/(cps||28));
  return iv;
}

const ThreeEng=(function(){
  let renderer,camera,active=null,scenes={},ok=false;
  function init(){
    if(!window.THREE)return false;
    try{
      renderer=new THREE.WebGLRenderer({canvas:$('#gl3d'),antialias:!IS_MOBILE,powerPreference:'high-performance',alpha:true});
      /* PERF v69: pixelRatio contenido (1 móvil / 1.25 desktop) — antes 1.5/2 congelaba el hangar */
      renderer.setPixelRatio(Math.min(devicePixelRatio||1,IS_MOBILE?1:1.25));
      renderer.setSize(innerWidth,innerHeight);
      renderer.setClearColor(0x0A0A0F,1);
      camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,400);
      camera.position.set(0,3,10);
      ok=true;
      window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
      Loop.add(dt=>{if(active&&scenes[active]){const s=scenes[active];renderer.render(s.scene,camera);}});
      return true;
    }catch(e){console.error('three init',e);return false;}
  }
  function reg(name,obj){scenes[name]=obj;}
  function show(name){active=name;$('#gl3d').style.display=ok?'block':'none';}
  function hide(){active=null;$('#gl3d').style.display='none';}
  /* PERF v69: calidad progresiva — 1º ratio 1, luego 0.72 (el bucle llama 2 veces máx) */
  let _qStep=0;
  function lowQuality(){_qStep=Math.min(2,_qStep+1);if(ok)renderer.setPixelRatio(_qStep===1?1:.72);}
  return{init,reg,show,hide,lowQuality,ready:()=>ok,camera:()=>camera,renderer:()=>renderer};
})();

/* ------- utilidades de textura canvas ------- */
function makeTextTexture(title,sub,color){
  const c=document.createElement('canvas');c.width=256;c.height=384;
  const g=c.getContext('2d');
  g.fillStyle='rgba(6,9,18,.92)';g.fillRect(0,0,256,384);
  g.strokeStyle=color;g.lineWidth=4;g.strokeRect(6,6,244,372);
  g.strokeStyle='rgba(255,255,255,.15)';g.lineWidth=1;g.strokeRect(14,14,228,356);
  g.fillStyle=color;g.font='700 26px Orbitron, sans-serif';g.textAlign='center';
  const words=title.split(' ');let y=150;
  words.forEach(w=>{g.fillText(w,128,y);y+=32;});
  g.fillStyle='rgba(240,240,240,.75)';g.font='16px Rajdhani, sans-serif';
  g.fillText(sub||'',128,y+18);
  g.strokeStyle=color;g.globalAlpha=.7;
  g.beginPath();g.moveTo(40,60);g.lineTo(216,60);g.stroke();
  g.beginPath();g.moveTo(40,320);g.lineTo(216,320);g.stroke();
  const t=new THREE.CanvasTexture(c);return t;
}
function makeLabelSprite(text,color,scale){
  const c=document.createElement('canvas');c.width=256;c.height=64;
  const g=c.getContext('2d');
  g.fillStyle='rgba(8,11,20,.75)';g.fillRect(0,0,256,64);
  g.fillStyle=color;g.font='700 26px Rajdhani, sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.fillText(text,128,34);
  const t=new THREE.CanvasTexture(c);
  const m=new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false});
  const s=new THREE.Sprite(m);s.scale.set((scale||2.4), (scale||2.4)/4,1);
  return s;
}
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
function worldToScreen(v){
  const cam=ThreeEng.camera();const p=v.clone().project(cam);
  return{x:(p.x*.5+.5)*innerWidth,y:(-p.y*.5+.5)*innerHeight,behind:p.z>1};
}

    else{mesh=new THREE.Mesh(new THREE.BoxGeometry(.55,.4,.3),new THREE.MeshStandardMaterial({color:0x232c47,roughness:.5,metalness:.4}));weight=11;rest=.15;mat='metal';}
    mesh.position.set(x,.4,z);mesh.rotation.y=rnd(0,6);
    mesh.castShadow=false;scene.add(mesh);
    grabbables.push({mesh,type,weight,rest,mat,vel:V3(0,0,0),held:false,target:null,spin:rnd(-2,2)});
  }
  [['sobre',-14,-8],['sobre',-16,-2],['carta',-13,3],['carta',-15,7],['trofeo',12,8],['trofeo',14,-3],['maletin',17,5],['sobre',5,9],['carta',8,-9],['carta',-5,-10],['sobre',10,2],['maletin',-18,-11]].forEach(a=>addGrab(a[0],a[1],a[2]));
  /* ---- monedas f\u00EDsicas (sistema 20) ---- */
  const coins=[];
  const coinGeo=new THREE.CylinderGeometry(.16,.16,.045,14);
  const coinMat=new THREE.MeshStandardMaterial({color:0xFFC24B,metalness:.95,roughness:.15,emissive:0x6b4a10,emissiveIntensity:.6});
  function spawnCoin(x,z,value,life,group){
    const m=new THREE.Mesh(coinGeo,coinMat.clone());
    m.material.emissiveIntensity=.4+Math.min(1,value/40);
    const s=1+Math.min(.9,value/25);m.scale.set(s,1,s);
    m.position.set(x,rnd(5,7.5),z);
    scene.add(m);
    coins.push({m,value,life:life||14,v:V3(rnd(-1.5,1.5),0,rnd(-1.5,1.5)),spin:rnd(6,14),group:group||null,collected:false});
  }
  let rainGroup=null,rainTotal=0,rainGot=0;
  function rewardRain(n,base){
    rainGroup='g'+now();rainTotal=0;rainGot=0;
    for(let i=0;i<n;i++){const v=Math.max(1,Math.round(base*rnd(.5,2)));
      rainTotal+=v;spawnCoin(rnd(-16,16),rnd(-11,11),v,10,rainGroup);}
    toast('LLUVIA DE MONEDAS','\u00A1Rec\u00F3gelas TODAS caminando para el bonus +25%!','gold',4200);
    SFX.whoosh();Shake.add(3,300);
  }
  /* ---- interacciones ---- */
  const ray=new THREE.Raycaster();
  let heldObj=null,holdTarget=V3(0,1.2,0),holdPlane=new THREE.Plane(V3(0,1,0),-1.1);
  function tryGrab(){
    if(heldObj)return;
    const cam=ThreeEng.camera();
    ray.setFromCamera({x:Pointer.x/innerWidth*2-1,y:-(Pointer.y/innerHeight)*2+1},cam);
    const meshes=grabbables.filter(g=>g.mesh.position.distanceTo(agent.pos)<9).map(g=>g.mesh);
    const hit=ray.intersectObjects(meshes,false)[0];
    if(hit){
      const g=grabbables.find(gg=>gg.mesh===hit.object);
      if(g){g.held=true;heldObj=g;document.body.style.cursor='grabbing';SFX.pop();}
    }
  }
  function releaseGrab(){
    if(!heldObj)return;
    heldObj.held=false;
    const cam=ThreeEng.camera();
    const f=heldObj.type==='trofeo'?4:(heldObj.type==='carta'?14:10);
    heldObj.vel.set(Pointer.vx*.06*f+agent.vel.x,2+Math.abs(Pointer.vy)*.05*f,Pointer.vy*.06*f+agent.vel.z);
    heldObj=null;document.body.style.cursor='';
    SFX.whoosh();
  }
  function matAt(x,z){if(x<-8)return 'alfombra';if(x>8)return 'vidrio';return 'metal';}
  function collide(px,pz){
    let x=clamp(px,-FXW/2+R_AGENT,FXW/2-R_AGENT),z=clamp(pz,-FXD/2+R_AGENT,FXD/2-R_AGENT),hit=false;
    for(const o of obstacles){
      const hx=o.w/2+R_AGENT,hz=o.d/2+R_AGENT;
      if(Math.abs(x-o.x)<hx&&Math.abs(z-o.z)<hz){
        const dx=x-o.x,dz=z-o.z;
        if(Math.abs(dx)/hx>Math.abs(dz)/hz)x=o.x+Math.sign(dx)*hx;else z=o.z+Math.sign(dz)*hz;
        hit=true;
      }
    }
    return{x,z,hit};
  }
  let nearDoor=null,nearStation=null,nearBench=null,nearIsland=false;
  function update(dt){
    const run=Key('ShiftLeft')||Key('ShiftRight')||Joy.mag>.92;
    const maxV=run?6.2:3.4,acc=run?26:16;
    let ix=0,iz=0;
    if(Key('KeyW')||Key('ArrowUp'))iz-=1;
    if(Key('KeyS')||Key('ArrowDown'))iz+=1;
    if(Key('KeyA')||Key('ArrowLeft'))ix-=1;
    if(Key('KeyD')||Key('ArrowRight'))ix+=1;
    if(Joy.active){ix+=Joy.dx;iz+=Joy.dy;}
    const il=Math.hypot(ix,iz);
    if(il>1){ix/=il;iz/=il;}
    agent.vel.x+=ix*acc*dt;agent.vel.z+=iz*acc*dt;
    const fr=Math.exp(-7*dt*(il>0?2.2:5));
    agent.vel.x*=fr;agent.vel.z*=fr;
    const sp=Math.hypot(agent.vel.x,agent.vel.z);
    if(sp>maxV){agent.vel.x*=maxV/sp;agent.vel.z*=maxV/sp;}
    agent.speed=sp;
    const np=collide(agent.pos.x+agent.vel.x*dt,agent.pos.z+agent.vel.z*dt);
    if(np.hit&&sp>3.2){SFX.thud(agent.pos);Shake.add(6,260);vibrate(60);
      agent.vel.x*=-.35;agent.vel.z*=-.35;FX.sparks(worldToScreen(agent.pos.clone().setY(1)).x,worldToScreen(agent.pos.clone().setY(1)).y,6,'30,144,255');}
    agent.pos.x=np.x;agent.pos.z=np.z;
    /* saltito/celebraci\u00F3n */
    if(agent.jumpV!==0||agent.pos.y>0){agent.pos.y+=agent.jumpV*dt;agent.jumpV-=22*dt;if(agent.pos.y<=0){agent.pos.y=0;agent.jumpV=0;}}
    let yawT=agent.heading;
    if(sp>.4)yawT=Math.atan2(agent.vel.x,agent.vel.z);
    if(agent.danceT>0){agent.danceT-=dt;yawT+=agent.danceT*9;}
    let dy=yawT-agent.heading;while(dy>Math.PI)dy-=Math.PI*2;while(dy<-Math.PI)dy+=Math.PI*2;
    agent.heading+=dy*Math.min(1,12*dt);
    const g=agent.group;
    g.position.copy(agent.pos);
    g.rotation.y=agent.heading;
    const bob=sp>.4?Math.abs(Math.sin(performance.now()/(run?95:150)))*(run?.1:.05):Math.sin(performance.now()/700)*.012;
    g.position.y=agent.pos.y+bob;
    g.rotation.x=run&&sp>3?-.08:0;
    /* tela: capa + pelo */
    const t=performance.now()/1000;
    if(agent.cape){
      const pos=agent.cape.geometry.attributes.position;
      const sway=clamp(sp/6,0,1);
      for(let i=0;i<pos.count;i++){
        const y=pos.getY(i),x=pos.getX(i);
        pos.setZ(i,-(Math.sin(t*6+x*4+y*2)*.05+sway*.5)*((.95-y)/1.9+.2));
      }
      pos.needsUpdate=true;
    }
    agent.hairs.forEach((h,i)=>{h.rotation.x=Math.sin(t*5+i)*.14+swayHair();function swayHair(){return clamp(sp*.1,0,.5);}});
    if(agent.companion.visible){agent.companion.rotation.y+=dt*3;agent.companion.position.y=1.55+Math.sin(t*3)*.06;}
    /* pasos + huellas */
    if(sp>.6){
      agent.footT+=sp*dt;
      if(agent.footT>1.6){agent.footT=0;SFX.step(matAt(agent.pos.x,agent.pos.z),agent.pos);if(sp>3.8)spawnPrint();}
    }
    /* frenado con polvo */
    if(sp>3&&il===0){
      agent.dustT+=dt;
      if(agent.dustT>.09){agent.dustT=0;const s=worldToScreen(agent.pos.clone());if(!s.behind)FX.dust(s.x,s.y+10,3);}
    }
    prints.forEach(p=>{if(p.life<1){p.life+=dt/2;p.m.material.opacity=Math.max(0,.65*(1-p.life));}});
    /* puertas cerca */
    nearDoor=null;
    for(const d of DOORS){
      if(Math.abs(agent.pos.x-d.x)<2.4&&agent.pos.z<-FXD/2+3.4){nearDoor=d;break;}
    }
    const dh=$('#doorHint');
    if(nearDoor){dh.style.display='block';dh.innerHTML='<span style="color:'+nearDoor.col+'">'+nearDoor.name+'</span><br><span class="small">'+(IS_MOBILE?'Toca la puerta':'Pulsa E o clic')+' para entrar</span>';}
    else dh.style.display='none';
    /* estaciones */
    nearStation=null;nearBench=null;
    if(agent.pos.distanceTo(V3(20.6,0,-6))<2.2)nearStation='hack';
    else if(agent.pos.distanceTo(V3(-20.6,0,2))<2.2)nearStation='detector';
    else if(agent.pos.distanceTo(V3(-20.6,0,-8))<2.2)nearStation='archivo';
    else for(const b of benches){if(Math.hypot(agent.pos.x-b.x,agent.pos.z-b.z)<2.4){nearBench=b;break;}}
    nearIsland=Math.hypot(agent.pos.x-19.5,agent.pos.z+12.6)<1.7;
    const sb=$('#stationBar');
    if(nearStation==='hack'){sb.className='stationBar on';sb.innerHTML='<button class="btn green sm" data-act="hack">TERMINAL DE HACKEO &raquo;</button>';}
    else if(nearStation==='detector'){sb.className='stationBar on';sb.innerHTML='<button class="btn red sm" data-act="detector">DETECTOR DE MENTIRAS &raquo;</button>';}
    else if(nearStation==='archivo'){sb.className='stationBar on';sb.innerHTML='<button class="btn gold sm" data-act="archivo">ARCHIVO CLASIFICADO &raquo;</button>';}
    else if(nearBench&&!nearBench.recruited()){sb.className='stationBar on';sb.innerHTML='<button class="btn sm" data-act="interview">ENTREVISTAR A '+nearBench.spec.name.toUpperCase()+' ['+nearBench.spec.spec+'] &raquo;</button>';}
    else sb.classList.remove('on');
    /* isla */
    if(nearIsland){
      islMat.opacity=.5+Math.sin(t*6)*.3;
      if(!P.island&&(P.knownIsland||P.morseHits>=3)){
        P.island=true;addCoins(777,'Isla del Or\u00E1culo');addXP(300);
        openModal('BIBLIOTECA DEL OR\u00C1CULO','<div class="ttl" style="color:var(--gold)">Has encontrado la isla secreta</div><p class="small" style="margin-top:8px">Bajo la arena hay un cofre del Or\u00E1culo: <b>+777 '+IC+'</b> y un archivo prohibido.</p>');
        rewardRain(14,20);save();
      }else if(!P.knownIsland&&P.morseHits<3){
        islLbl.material.opacity=.4+Math.sin(t*2)*.2;
      }
    }
    /* monedas */
    for(let i=coins.length-1;i>=0;i--){
      const c=coins[i];
      if(c.collected){coins.splice(i,1);continue;}
      c.life-=dt;if(c.life<=0){scene.remove(c.m);coins.splice(i,1);continue;}
      c.v.y-=9.8*dt;
      c.m.position.addScaledVector(c.v,dt);
      c.m.rotation.x+=c.spin*dt;
      if(c.m.position.y<.1){
        c.m.position.y=.1;c.v.y*=-.45;c.v.x*=.85;c.v.z*=.85;
        if(Math.abs(c.v.y)>.6)SFX.coin(c.value>=20,c.m.position);
      }
      c.m.position.x=clamp(c.m.position.x,-FXW/2+.3,FXW/2-.3);
      c.m.position.z=clamp(c.m.position.z,-FXD/2+.3,FXD/2-.3);
      if(Math.hypot(c.m.position.x-agent.pos.x,c.m.position.z-agent.pos.z)<(0.9+c.m.scale.x*.12)){
        c.collected=true;scene.remove(c.m);
        addCoins(c.value,null);SFX.coin(c.value>=20);vibrate(15);
        if(c.group===rainGroup){rainGot+=c.value;
          if(!coins.some(cc=>cc.group===rainGroup&&!cc.collected)){
            const bonus=Math.round(rainGot*.25);
            if(bonus>0){addCoins(bonus,'bonus 25% recogida total');
              toast('RECOGIDA PERFECTA','+25% bonus: +'+bonus+' '+IC,'gold');FX.confetti(60);SFX.win();}
          }
        }
      }
    }
    /* objetos agarrables: f\u00EDsica */
    if(heldObj){
      const cam=ThreeEng.camera();
      ray.setFromCamera({x:Pointer.x/innerWidth*2-1,y:-(Pointer.y/innerHeight)*2+1},cam);
      ray.ray.intersectPlane(holdPlane,holdTarget);
      holdTarget.y=Math.max(.4,holdTarget.y);
      holdTarget.x=clamp(holdTarget.x,-FXW/2+.4,FXW/2-.4);holdTarget.z=clamp(holdTarget.z,-FXD/2+.4,FXD/2-.4);
      const k=heldObj.type==='trofeo'?9:(heldObj.type==='sobre'?30:22);
      const c2=heldObj.type==='trofeo'?6:5;
      heldObj.vel.x+=((holdTarget.x-heldObj.mesh.position.x)*k-heldObj.vel.x*c2)*dt;
      heldObj.vel.y+=((holdTarget.y-heldObj.mesh.position.y)*k-heldObj.vel.y*c2)*dt;
      heldObj.vel.z+=((holdTarget.z-heldObj.mesh.position.z)*k-heldObj.vel.z*c2)*dt;
      if(heldObj.type==='carta'){heldObj.vel.x+=agent.vel.x*.9*dt*8;heldObj.vel.z+=agent.vel.z*.9*dt*8;}
    }
    for(const gr of grabbables){
      const m=gr.mesh;
      if(gr.held){m.position.addScaledVector(gr.vel,dt);}
      else{
        gr.vel.y-=(gr.type==='sobre'?1.6:gr.type==='carta'?1.2:9.8)*dt;
        if(gr.type==='carta'){gr.vel.x+=Math.sin(t*2+m.position.x)*.25*dt*8;gr.vel.z+=Math.cos(t*1.7+m.position.z)*.25*dt*8;}
        m.position.addScaledVector(gr.vel,dt);
        if(m.position.y<gr.type==='trofeo'?.25:.2){
          m.position.y=gr.type==='trofeo'?.25:.2;
          if(Math.abs(gr.vel.y)>1.2){SFX.bounce(gr.mat,Math.abs(gr.vel.y),m.position);}
          gr.vel.y*=-gr.rest;gr.vel.x*=.86;gr.vel.z*=.86;
        }
        if(m.position.x<-FXW/2+.3||m.position.x>FXW/2-.3){gr.vel.x*=-.6;m.position.x=clamp(m.position.x,-FXW/2+.3,FXW/2-.3);SFX.bounce('metal',2,m.position);}
        if(m.position.z<-FXD/2+.3||m.position.z>FXD/2-.3){gr.vel.z*=-.6;m.position.z=clamp(m.position.z,-FXD/2+.3,FXD/2-.3);}
      }
      if(!gr.held)m.rotation.y+=gr.spin*dt*(gr.vel.length()*.2+.05);
      m.rotation.z=clamp(-gr.vel.x*.05,-.5,.5);
    }
    /* clic para agarrar / soltar */
    if(Pointer.justDown&&!Pointer.touch&&activeRoomName==='hangar'&&!isUI(document.elementFromPoint(Pointer.x,Pointer.y)||document.body)){
      if(heldObj)releaseGrab();else tryGrab();
    }
    if(Pointer.longPress&&Pointer.touch&&activeRoomName==='hangar'&&!heldObj)tryGrab();
    if(!Pointer.down&&heldObj)releaseGrab();
    /* bots */
    bots.forEach(b=>{
      const u=b.userData;
      u.t-=dt;
      if(u.t<=0||!u.target){u.target=V3(rnd(-18,18),0,rnd(-12,12));u.t=rnd(3,8);}
      const dx=u.target.x-b.position.x,dz=u.target.z-b.position.z,d=Math.hypot(dx,dz);
      if(d>.4){b.position.x+=dx/d*1.4*dt;b.position.z+=dz/d*1.4*dt;b.rotation.y=Math.atan2(dx,dz);}
      b.position.y=Math.abs(Math.sin(performance.now()/300))*.08;
      u.halo.scale.setScalar(1+Math.sin(performance.now()/400)*.12);
    });
    /* c\u00E1mara */
    const cam=ThreeEng.camera();
    const parX=(Pointer.x/innerWidth-.5)*1.6;
    const desired=V3(agent.pos.x-agent.vel.x*.25+parX*.4,3.6+agent.pos.y*.4,agent.pos.z+6.4);
    cam.position.lerp(desired,Math.min(1,5*dt));
    cam.position.x+=Shake.ox()*.05;cam.position.y+=Shake.oy()*.05;
    cam.lookAt(agent.pos.x,1.2+agent.pos.y,agent.pos.z);
    /* puertas pulso */
    doorMeshes.forEach((m,i)=>{
      const near=Math.abs(agent.pos.x-DOORS[i].x)<3&&agent.pos.z<-10;
      m.scale.setScalar(lerp(m.scale.x,near?1.12:1+Math.sin(t*2+i)*.02,.1));
    });
    [hackPed,detPed,arcPed].forEach(p=>{p.userData.core.rotation.y+=dt*2;p.userData.core.rotation.x+=dt;});
  }
  function celebrate(){agent.jumpV=5;FX.confetti(50);SFX.fanfare();}
  function dance(){agent.danceT=2;}
  function enter(){
    Joy.enabled=true;
    ThreeEng.show('hangar');syncBots();syncCompanion();
    ThreeEng.camera().position.set(agent.pos.x,3.6,agent.pos.z+6.4);
    if(P.recruits.length&&!agent.companion.visible)syncCompanion();
  }
  function exit(){$('#doorHint').style.display='none';$('#stationBar').classList.remove('on');document.body.style.cursor='';}
  function onKey(e){
    if(e.code==='KeyE'||e.code==='Enter'){
      if(nearDoor)go(nearDoor.room);
      else if(nearStation==='hack')go('hack');
      else if(nearStation==='detector')go('detector');
      else if(nearStation==='archivo')go('archivo');
      else if(nearBench)Recruit.interview(nearBench.spec);
      else if(nearIsland&&P.knownIsland)toast('ISLA DEL OR\u00C1CULO',P.island?'La isla ya te dio su secreto.':'Algo dorado late bajo la arena...','gold');
    }
  }
  function onPointerUp(e){
    if(nearDoor&&Pointer.moved<12&&!isUI(e.target))go(nearDoor.room);
  }
  function onLongPress(x,y){if(activeRoomName==='hangar')tryGrab();}
  ThreeEng.reg('hangar',{scene:scene,update:dt=>update(dt)});
  regHangar({scene,update,enter,exit,onKey,onPointerUp,onLongPress,hide3d:false});
  return{scene,update,enter,exit,onKey,onPointerUp,onLongPress,celebrate,dance,rewardRain,syncCompanion,
    grabRay:{tryGrab,releaseGrab},agent,coins,addBot};
})();
function regIntro(o){registerRoom('intro',Object.assign({section:'scr-intro',three:true},o));}

  function zones(){
    const z=CONFLICT_SEED.map(c=>({...c}));
    if(DATA.pulso&&DATA.pulso.zones)DATA.pulso.zones.forEach((pz,i)=>{
      const pos=ZONE_POS[pz.id]||{lat:30+i*10,lng:30};
      z.push({lat:pos.lat,lng:pos.lng,name:pz.label,i:clamp(.3+pz.total/18,.3,1),live:true});
    });
    return z;
  }
  function buildFlames(){
    zones().forEach(zn=>{
      const n=IS_MOBILE?60:110;
      const g=new THREE.BufferGeometry();
      const pos=new Float32Array(n*3),seed=[];
      const base=ll2v(zn.lat,zn.lng,R*1.005);
      const up=base.clone().normalize();
      for(let i=0;i<n;i++){seed.push({t:Math.random(),a:rnd(0,Math.PI*2),r:rnd(.02,.14)*zn.i+ .015,s:rnd(.5,1.4)});}
      g.setAttribute('position',new THREE.BufferAttribute(pos,3));
      const col=zn.live?0x00FF87:0xff7a2a;
      const pts=new THREE.Points(g,new THREE.PointsMaterial({color:col,size:.045,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));
      gGroup.add(pts);
      const glow=new THREE.Mesh(new THREE.SphereGeometry(.09*zn.i+.05,10,10),
        new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.5,blending:THREE.AdditiveBlending}));
      glow.position.copy(base);gGroup.add(glow);
      /* PERF v69: tangentes precalculadas UNA vez — antes se clonaban 2 vectores por partícula por frame (miles de allocs = congelación) */
      const t1=V3(0,1,0).cross(up);
      if(t1.lengthSq()<1e-6)t1.set(1,0,0);t1.normalize();
      const t2=up.clone().cross(t1).normalize();
      flames.push({zn,pts,seed,base,up,glow,t1,t2});
    });
  }
  function buildPlanes(){
    if(!DATA.pulso||!DATA.pulso.zones)return;
    DATA.pulso.zones.forEach(zn=>{
      const c=ZONE_POS[zn.id]||{lat:30,lng:30};
      zn.planes.slice(0,6).forEach(pl=>{
        const m=new THREE.Mesh(new THREE.ConeGeometry(.03,.1,6),new THREE.MeshBasicMaterial({color:pl.mil?0xFF3B30:0x1E90FF}));
        m.position.copy(ll2v(c.lat+rnd(-4,4),c.lng+rnd(-4,4),R+0.18+((pl.altM||9000)/12000)*.3));
        m.userData={plane:pl,zone:zn.label};
        gGroup.add(m);planes3d.push(m);
      });
    });
  }
  function buildQuakes(){
    DATA.quakes.forEach(q=>{
      const ring=new THREE.Mesh(new THREE.RingGeometry(.08,.1,32),
        new THREE.MeshBasicMaterial({color:0xFFC24B,transparent:true,opacity:.85,side:THREE.DoubleSide}));
      const p=ll2v(q.lat,q.lng,R*1.01);
      ring.position.copy(p);
      ring.lookAt(p.clone().multiplyScalar(2));
      ring.userData={quake:q,ph:rnd(0,6)};

  function buildClouds(){
    const n=IS_MOBILE?140:260;
    const g=new THREE.BufferGeometry();
    const pos=new Float32Array(n*3),vel=[];
    for(let i=0;i<n;i++){
      const zn=pick(CONFLICT_SEED);
      const base=ll2v(zn.lat+rnd(-3,3),zn.lng+rnd(-3,3),R*1.06);
      pos[i*3]=base.x;pos[i*3+1]=base.y;pos[i*3+2]=base.z;
      vel.push(V3(rnd(-.05,.05),rnd(-.05,.05),rnd(-.05,.05)));
    }
    g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const pts=new THREE.Points(g,new THREE.PointsMaterial({color:0x6a7a95,size:.06,transparent:true,opacity:.5,depthWrite:false}));
    gGroup.add(pts);cloudPts.push({pts,vel,g});

  const spyMeshes=[];

    spies.forEach((sp,i)=>{

  /* --- controles --- */
  let dragging=false,dragMoved=0;
  function onPointerMove(e){
    if(mode==='iss')return;
    if(Pointer.down&&!Pointer.pinchHandled){
      rotVY=Pointer.dx*.0035;rotVX=Pointer.dy*.0035;
      gGroup.rotation.y+=rotVY;
      gGroup.rotation.x=clamp(gGroup.rotation.x+rotVX,-1.1,1.1);
      dragMoved+=Math.abs(Pointer.dx)+Math.abs(Pointer.dy);
      idleT=0;
    }
  }
  function onPointerUp(e){
    if(dragMoved<10&&!isUI(e.target))tapGlobe(e);
    dragMoved=0;
    rotVX*=1;rotVY*=1;
  }
  function onWheel(dy){
    const cam=ThreeEng.camera();
    cam.position.multiplyScalar(1+clamp(dy,-1,1)*.08);
    /* FIX v69: nunca bajar al "nivel de tierra" — la textura se ve mal pegado al suelo.
       Mínimo R*2.05 (altura segura sobre la superficie). */
    cam.position.clampLength(R*2.05,R*6.5);
  }
  let moveMode=null;
  function tapGlobe(e){
    const cam=ThreeEng.camera();
    const ray=new THREE.Raycaster();
    ray.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},cam);
    /* aviones primero */
    const ph=ray.intersectObjects(planes3d,false)[0];
    if(ph){followCine(ph.object);return;}
    if(mode==='iss'){
      if(captureReady){captureShot();return;}
    }
    /* esp\u00EDas */
    const spyHit=ray.intersectObjects(spies.filter(s=>s.mesh).map(s=>s.mesh),false)[0];
    if(spyHit){
      const sp=spies.find(s=>s.mesh===spyHit.object);
      if(sp.pulse){spyCollect(sp);}
      else{
        openModal('ESP\u00CDA EN '+esc((sp.n||'posici\u00F3n').toUpperCase()),
          '<div class="stat">Energ\u00EDa: <b>'+Math.round(sp.energy)+'%</b></div>'
          +'<button class="btn green sm" id="spyChg" style="margin-top:8px;width:100%">VISITA VIRTUAL (recarga +40%)</button>'
          +'<button class="btn sm" id="spyMov" style="margin-top:6px;width:100%">REDESPLEGAR A OTRO PA\u00CDS (-20%)</button>',()=>{});
        $('#spyChg').onclick=()=>{sp.energy=Math.min(100,sp.energy+40);toast('ESP\u00CDA','Energ\u00EDa recargada','good');SFX.bell();closeModal();renderSpyPanel();};
        $('#spyMov').onclick=()=>{if(sp.energy<20){toast('ESP\u00CDA','Sin energ\u00EDa para moverse','bad');return;}moveMode=sp;closeModal();toast('REDESPLIEGUE','Toca el pa\u00EDs destino en el globo','',4000);};
      }
      renderSpyPanel();return;
    }
    /* sismos */
    const qh=ray.intersectObjects(quakeRings,false)[0];
    if(qh){
      const q=qh.object.userData.quake;
      vibrate(60+Math.min(120,(q.mag||4)*18));
      openModal('SISMO DETECTADO','<div class="big-num" style="color:var(--gold)">M'+(q.mag||q.m)+'</div><p class="small">'+esc(q.place||'')+'</p><p class="small dim">Profundidad '+(q.depth||'?')+' km \u00B7 '+(q.time?new Date(q.time).toLocaleString('es'):'')+'</p>');
      SFX.thud();return;
    }
    /* pa\u00EDs */
    const gh=ray.intersectObject(earth,false)[0];
    if(gh){
      const ll=v2ll(gh.point.clone().applyMatrix4(new THREE.Matrix4().copy(gGroup.matrixWorld).invert()));
      const c=nearestCountry(ll.lat,ll.lng);
      if(moveMode){
        if(c){moveMode.lat=c.lat;moveMode.lng=c.lng;moveMode.n=c.n;moveMode.c2=c.c2;moveMode.energy=Math.max(0,moveMode.energy-20);
          toast('ESP\u00CDA REDESPLEGADO','Nueva posici\u00F3n: '+c.n,'good');SFX.whoosh();}
        else toast('REDESPLIEGUE','Toca tierra firme (un pa\u00EDs)','bad');
        moveMode=null;renderSpyPanel();return;
      }
      if(c)showCountry(c);
    }
  }
  function nearestCountry(lat,lng){
    let best=null,bd=1e9;
    (DATA.countries.length?DATA.countries:FALLBACK_COUNTRIES).forEach(c=>{
      if(c.lat==null)return;
      const d=Math.hypot((c.lat-lat)*.9,(c.lng-lng)*1.1);
      if(d<bd){bd=d;best=c;}
    });
    return bd<26?best:null;
  }

  /* esp\u00EDas: eventos y recogida */
  function updateSpies(dt){
    spies.forEach(sp=>{sp.energy=Math.max(0,sp.energy-dt*1.4);});
    spyEventT-=dt;
    if(spyEventT<=0){
      spyEventT=rnd(18,36);
      const sp=pick(spies.filter(s=>s.energy>15))||spies[0];
      sp.pulse=true;sp.pulseT=30;
      const cs=nearestCountry(sp.lat,sp.lng)||{n:'zona desconocida'};
      sp.n=cs.n||sp.n;sp.c2=cs.c2||sp.c2;
      toast('SE\u00D1AL DE ESP\u00CDA',sp.n+' tiene algo. \u00A1Tienes 30s!','bad',4200);
      SFX.alarm();
    }
    spies.forEach(sp=>{
      if(sp.pulse){sp.pulseT-=dt;
        if(sp.pulseT<=0){sp.pulse=false;toast('INFORMACI\u00D3N PERDIDA','La se\u00F1al de '+sp.n+' se apag\u00F3...','bad');World.bump(.6,'intel perdida');}
      }
    });
    syncSpyMeshes();
  }
  function spyCollect(sp){
    sp.pulse=false;sp.pulseT=0;
    const intel={t:now(),n:sp.n,txt:'Informe interceptado de '+sp.n+' \u00B7 '+new Date().toLocaleTimeString('es'),kind:'spy'};
    P.files.push(intel);save();
    const from=sp.mesh.position.clone().normalize();
    const to=ll2v(35,10,R*1.05).normalize();
    for(let i=0;i<16;i++){
      const p=from.clone().lerp(to,i/16).multiplyScalar(R*(1.05+Math.sin(i/16*Math.PI)*.25));
      const s=worldToScreen(gGroup.localToWorld(p.clone()));
      if(!s.behind)setTimeout(()=>FX.sparks(s.x,s.y,6,'0,255,135'),i*60);
    }
    addXP(40);addCoins(30,'esp\u00EDa');
    toast('INTELIGENCIA OBTENIDA','Informe de '+sp.n+' archivado','good');
    checkOmega();
  }

  function llDist(a,b,c,d){return Math.hypot(a-c,Math.min(Math.abs(b-d),360-Math.abs(b-d)));}

  /* clima — PERF v69: vectores reutilizados, sin new por partícula */
  const _cp=V3(0,0,0),_cn=V3(0,0,0),_ct=V3(0,0,0);
  function updateClouds(dt){
    cloudPts.forEach(cl=>{
      const pos=cl.g.attributes.position;
      const wind=Wind.level;
      for(let i=0;i<pos.count;i++){
        const v=cl.vel[i];
        _cp.set(pos.getX(i),pos.getY(i),pos.getZ(i));
        _cn.copy(_cp).normalize();
        _ct.set(-_cn.z,0,_cn.x).normalize();
        _cp.addScaledVector(_ct,(v.x+wind*1.6)*dt);
        _cp.addScaledVector(_cn,Math.sin(performance.now()/900+i)*.0006);
        if(_cp.length()>R*1.16)_cp.multiplyScalar(R*1.06/_cp.length());
        pos.setXYZ(i,_cp.x,_cp.y,_cp.z);
      }
      pos.needsUpdate=true;
    });
  }

        else if(t==='spies'){renderSpyPanel();toast('RED DE ESP\u00CDAS','Arrastra un esp\u00EDa de pa\u00EDs a pa\u00EDs. Cuando pulse en rojo: llega antes de 30s.','',5000);}
        else if(t==='weather'){toast('CLIMA DE CONFLICTOS','Mueve el cursor r\u00E1pido (o sopla al micr\u00F3fono) para dispersar nubes. SOPLO FR\u00CDOLO baja la tensi\u00F3n.','',5000);
          $('#globoInfo').innerHTML='<div class="panel" style="margin:0 auto;max-width:420px"><div class="rowline"><span class="small">Viento detectado</span><b class="num" id="windLvl">0%</b></div>'
          +'<button class="btn sm gold" id="coldBtn" style="width:100%;margin-top:8px">SOPLO FR\u00CDO (-0.25 tensi\u00F3n)</button>'
          +'<button class="btn sm '+(Mic.on?'red':'')+'" id="micBtn" style="width:100%;margin-top:6px">'+(Mic.on?'APAGAR MICR\u00D3FONO':'SOPlar AL MICR\u00D3FONO')+'</button></div>'.replace('SOPlar','SOPLAR');
          $('#coldBtn').onclick=coldBlow;
          $('#micBtn').onclick=async()=>{if(Mic.on){Mic.stop();}else{const ok=await Mic.start();if(ok)toast('MICR\u00D3FONO','Sopla fuerte para generar viento','good');}enter();};
        }
        else if(t==='ar')enterAR();
        else if(t==='drone')go('dron');
      };
    });
    const cam=ThreeEng.camera();
    cam.position.set(0,1.2,5.4);cam.lookAt(0,0,0);
    gGroup.rotation.set(.3,0,0);
    renderSpyPanel();
  }
  function exit(){
    exitAR();followPlane=null;mode='libre';SFX.staticLevel(0);
    $('#globoInfo').innerHTML='';
  }
  function update(dt){
    if(!ready)return;
    idleT+=dt;
    if(!Pointer.down&&mode!=='cine'){
      if(idleT>3)gGroup.rotation.y+=dt*.05;
      gGroup.rotation.y+=rotVY;gGroup.rotation.x=clamp(gGroup.rotation.x+rotVX,-1.1,1.1);
      rotVX*=Math.pow(.06,dt);rotVY*=Math.pow(.06,dt);
    }
    /* llamas con viento — PERF v69: aritmética directa, cero allocs por partícula */
    const t=performance.now()/1000;
    flames.forEach(f=>{
      const pos=f.pts.geometry.attributes.position;
      const wx=clamp(Wind.x*.9,-1,1)*.6,wy=clamp(-Wind.y*.9,-1,1)*.3;
      const w=f.up,t1=f.t1,t2=f.t2;
      const bx=f.base.x,by=f.base.y,bz=f.base.z;
      for(let i=0;i<f.seed.length;i++){
        const s=f.seed[i];
        s.t+=dt*s.s*(1+Wind.level*2.2);if(s.t>1)s.t-=1;
        const h=s.t*1.15*f.zn.i+.05;
        const r=(1-s.t)*.16*f.zn.i+.015;
        const px=Math.cos(s.a)*r+wx*h,py=h,pz=Math.sin(s.a)*r;
        const a1=px+wx*h*1.4;
        pos.setXYZ(i,
          bx+w.x*py+t1.x*a1+t2.x*pz,
          by+w.y*py+t1.y*a1+t2.y*pz,
          bz+w.z*py+t1.z*a1+t2.z*pz);
      }
      pos.needsUpdate=true;
      f.glow.scale.setScalar(1+Math.sin(t*5+f.base.x*9)*.25+Wind.level*.5);
    });
    quakeRings.forEach(r=>{
      r.userData.ph+=dt*1.2;
      const k=(r.userData.ph%1);
      r.scale.setScalar(1+k*4.5*(r.userData.quake.mag||3)/3);
      r.material.opacity=.85*(1-k);
    });
    planes3d.forEach(m=>{m.rotation.y+=dt*.5;});
    updateClouds(dt);
    updateSpies(dt);
    updateISS(dt);
    /* c\u00E1mara */
    const cam=ThreeEng.camera();
    if(mode==='cine'&&followPlane){
      const p=followPlane.getWorldPosition(V3(0,0,0));
      const camPos=p.clone().normalize().multiplyScalar(R+1.1);
      cam.position.lerp(gGroup.localToWorld(camPos),Math.min(1,4*dt));
      cam.lookAt(gGroup.localToWorld(followPlane.position.clone()));
    }else if(mode==='iss'&&DATA.iss){
      const p=issGroup.getWorldPosition(V3(0,0,0));
      const off=V3(Pointer.x/innerWidth-.5,0,Pointer.y/innerHeight-.5).multiplyScalar(1.4)
        .add(V3(Gyro.gamma/90,0,Gyro.beta/90));
      cam.position.lerp(p.clone().add(V3(0,.6,1.2)).add(off),Math.min(1,3*dt));
      cam.lookAt(p);
      if(Pointer.down&&Pointer.moved>2)cam.position.multiplyScalar(1);
    }else{
      const d=cam.position.length();
      cam.position.set(0,0,d);
      if(Pinch.active){cam.position.multiplyScalar(clamp(1/Pinch.delta,.96,1.04));}
      /* FIX v69: clamp SIEMPRE — ni rueda ni pellizco pueden acercarte al nivel del suelo */
      cam.position.clampLength(R*2.05,R*6.5);
      cam.lookAt(0,0,0);
    }
    const wl=$('#windLvl');if(wl)wl.textContent=Math.round((Wind.level+Mic.level)/1.4*100)+'%';
  }
  registerRoom('globo',{section:'scr-globo',three:true,enter,exit,update,onPointerMove,onPointerUp,onWheel,
    onLongPress(x,y){/* en m\u00F3vil: toque largo = soplar r\u00E1faga */Wind.x=rnd(-1,1);Wind.y=-1;Wind.level=1;setTimeout(()=>Wind.level=0,400);}});
  return{spies,enterAR,exitAR,initSpies};
})();

];
(function(){
  const COLS=26,ROWS=16,LAYERS=4;
  let soil,layer,items,cw,ch,digAcc=0,revealed;
  function cellW(){return G2.w/COLS;}
  function cellH(){return (G2.h*.72)/ROWS;}
  function newLayer(){
    soil=[];revealed=[];
    for(let r=0;r<ROWS;r++){soil.push(new Array(COLS).fill(1));revealed.push(new Array(COLS).fill(false));}
    items=BIBLIO_ITEMS.filter(b=>b.layer===layer).map(b=>({...b,
      cx:irnd(3,COLS-4),cy:irnd(2,ROWS-3),cells:0,found:false,imgOk:true}));
    if(layer===LAYERS-1)items.push({chest:true,t:'COFRE DEL OR\u00C1CULO',txt:'Una carta de rareza m\u00E1xima duerme aqu\u00ED.',cx:irnd(5,COLS-6),cy:irnd(3,ROWS-4),cells:0,found:false});
    items.forEach(it=>{
      it.area=[];
      const w=it.chest?3:2,h=it.chest?2:2;
      for(let dx=0;dx<w;dx++)for(let dy=0;dy<h;dy++)it.area.push([it.cx+dx,it.cy+dy]);
      it.total=it.area.length;
    });
  }
  function digAt(px,py){
    const radius=layer>=2?2.1:2.6;
    let removed=0;
    const cwv=cellW(),chv=cellH();
    const cr=Math.floor(px/cwv),cc=Math.floor(py/chv);
    for(let r=Math.max(0,cr-3);r<Math.min(ROWS,cr+4);r++)
      for(let c=Math.max(0,cc-3);c<Math.min(COLS,cc+4);c++){
        if(Math.hypot(r-cr,c-cc)>radius)continue;
        if(soil[r][c]>0){soil[r][c]=0;removed++;}
      }
    if(removed){
      items.forEach(it=>{
        if(it.found)return;
        let cleared=0;
        it.area.forEach(([r,c])=>{if(r<ROWS&&c<COLS&&soil[r][c]===0)cleared++;});
        if(cleared/it.total>=.8)revealItem(it,px,py);
      });
    }
    return removed;
  }
  function revealItem(it,px,py){
    it.found=true;
    FX.sparks(px,py,20,'255,194,75');FX.rings(px,py,1.2,2);
    SFX.bell();Shake.add(2,150);
    if(it.chest){
      const card={id:'c'+now(),name:'OR\u00C1CULO PRIMIGENIO',stars:5,ed:'\u00DANICA',t:now()};
      P.cards.push(card);addCoins(250,'cofre');addXP(200);
      openModal('COFRE DEL OR\u00C1CULO','<div class="holo marco" style="text-align:center;padding:20px"><div class="ttl" style="color:var(--gold);font-size:16px">CARTA 5&#9733;</div><div class="ttl" style="font-size:20px;margin:8px 0">OR\u00C1CULO PRIMIGENIO</div><div class="small">Rareza m\u00E1xima \u00B7 part\u00EDculas de universo incluidas</div></div>');
      save();return;
    }
    const file={t:now(),n:it.t,txt:it.txt,img:it.img,kind:'dig'};
    P.files.push(file);addXP(40+layer*20);addCoins(20+layer*15,'excavación');
    save();checkOmega();
    openModal('DOCUMENTO EXHUMADO',
      '<img class="wsImg" src="'+it.img+'" style="'+(it.burned?'filter:sepia(.7) contrast(1.2);clip-path:polygon(0 0,100% 0,100% 62%,58% 100%,0 100%);':'')+'">'
      +(it.burned?'<div class="tag r" style="margin-top:6px">PARCIALMENTE QUEMADO</div>':'')
      +'<h3 class="ps" style="color:var(--gold)">'+esc(it.t)+'</h3><p class="small">'+esc(it.txt)+'</p>'
      +'<p class="small dim">Capa '+(layer+1)+' \u00B7 Wikimedia Commons \u00B7 guardado en tu Biblioteca</p>');
    pushFeed('exhum\u00F3 "'+it.t+'" en la Biblioteca Secreta','y');
  }
  function draw(){
    const ctx=G2.ctx,W=G2.w,H=G2.h;
    ctx.clearRect(0,0,W,H);
    const cwv=cellW(),chv=cellH();
    const tone=['#241a10','#1c1710','#141418','#0d0d12'][layer];
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const v=soil[r][c];
      ctx.fillStyle=v>0?tone:'rgba(8,10,16,.9)';
      if(v>0){ctx.globalAlpha=.35+ (r%2)*.12;ctx.fillRect(c*cwv,r*chv,cwv+1,chv+1);ctx.globalAlpha=1;}
    }
    ctx.strokeStyle='rgba(255,255,255,.04)';
    for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*chv);ctx.lineTo(W,r*chv);ctx.stroke();}
    /* brillo de objetos enterrados (pista sutil) */
    items.forEach(it=>{if(!it.found){
      const cx=it.cx*cwv+cwv,cy=it.cy*chv+chv;

/* ---------- FRANCOTIRADOR GEOPOL\u00CDTICO ---------- */
(function(){
  let bubbles,clusters,scope,time,score,got,missed,over,aimX,aimY,stamina;
  function start(){
    bubbles=[];clusters=[];score=0;got=0;missed=0;over=false;time=60;stamina=3;
    aimX=G2.w/2;aimY=G2.h/2;
    for(let i=0;i<5;i++)clusters.push({x:rnd(G2.w*.1,G2.w*.9),y:G2.h*rnd(.72,.86),n:0});
    spawnT=0;
  }
  let spawnT=0;
  function spawn(){
    const truth=Math.random()<.28;
    const r=rnd(14,34);
    bubbles.push({x:rnd(40,G2.w-40),y:-30,r,vx:rnd(-30,30),vy:rnd(28,60)+(34-r)*1.2,type:truth?'true':'dis',ph:rnd(0,6)});
  }
  function shoot(){
    if(over)return;
    SFX.pop();vibrate(20);
    let hit=null;
    for(let i=bubbles.length-1;i>=0;i--){
      const b=bubbles[i];
      if(Math.hypot(b.x-aimX,b.y-aimY)<b.r+16){hit=b;bubbles.splice(i,1);break;}
    }
    if(!hit){FX.dust(aimX,aimY,3);return;}
    if(hit.type==='dis'){
      const val=Math.max(4,Math.round(40-hit.r));
      score+=val;got++;
      addCoins(val,'francotirador');addXP(6);
      FX.sparks(hit.x,hit.y,14,'30,144,255');SFX.coin(val>=20);
    }else{
      score=Math.max(0,score-25);missed++;
      toast('INFO VERIFICADA','Era informaci\u00F3n VERDADERA. Dilema moral: -25','bad',2500);
      FX.sparks(hit.x,hit.y,10,'0,255,135');SFX.fail();
    }
  }
  registerRoom('sniper',{section:'scr-room',
    enter(){
      Joy.enabled=false;G2.show();start();
      const sec=$('#scr-room');
      sec.innerHTML='<button class="btn sm back" id="xb">&laquo; SALIR</button><div style="text-align:center"><h2 class="pt">FRANCOTIRADOR GEOPOL\u00CDTICO</h2><p class="small">Elimina <b style="color:var(--blue)">burbujas de desinformaci\u00F3n</b> antes de que lleguen a la poblaci\u00F3n. NO dispares a la informaci\u00F3n verificada <span class="tag g">VERDADERA</span>. '+(IS_MOBILE?'Toca para disparar. Mant\u00E9n para apuntar firme.':'Clic dispara. Mant\u00E9n para apuntar firme (3s de pulso firme).')+'</p></div>';
      $('#xb').onclick=()=>go('sim');
      sec.style.pointerEvents='none';$('#xb').style.pointerEvents='auto';
    },
    exit(){G2.hide();$('#scr-room').style.pointerEvents='';
      if(score>P.bestSniper){P.bestSniper=score;save();}
    },
    update(dt){
      if(!G2.on)return;
      if(over){draw();return;}
      time-=dt;
      if(time<=0){over=true;
        const won=score>=120;
        if(won){addCoins(100,'francotirador ronda');addXP(60);SFX.win();FX.confetti(50);}
        else{SFX.fail();toast('CASI LO LOGRAS','Te faltaron '+Math.max(0,120-score)+' puntos para el bonus. Revancha inmediata.','bad',4500);}
      }
      spawnT-=dt;
      if(spawnT<=0){spawnT=rnd(.5,1.1);spawn();}
      const steady=Pointer.down&&stamina>0;
      if(steady)stamina-=dt;else stamina=Math.min(3,stamina+dt*.7);
      const trem=steady?1.2:4.5;
      aimX=lerp(aimX,Pointer.x,.25)+Math.sin(performance.now()/90)*trem*.4;
      aimY=lerp(aimY,Pointer.y,.25)+Math.cos(performance.now()/120)*trem*.4;
      if((Pointer.justDown&&!Pointer.longPress))shoot();
      for(let i=bubbles.length-1;i>=0;i--){
        const b=bubbles[i];
        b.x+=b.vx*dt+Math.sin(performance.now()/300+b.ph)*.6;
        b.y+=b.vy*dt;
        let hitPop=false;
        clusters.forEach(c=>{if(Math.hypot(c.x-b.x,c.y-b.y)<30)hitPop=true;});
        if(hitPop||b.y>G2.h){
          bubbles.splice(i,1);
          if(hitPop&&b.type==='dis'){World.bump(.5,'desinformaci\u00F3n alcanz\u00F3 a la poblaci\u00F3n');FX.ink(b.x,b.y);}
        }
      }
      draw();
    },
    onKey(e){if(e.code==='Space')shoot();},
    onPointerMove(){}
  });
  function draw(){
    const ctx=G2.ctx,W=G2.w,H=G2.h;
    ctx.fillStyle='#070a12';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(30,144,255,.08)';
    for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    clusters.forEach(c=>{
      for(let i=0;i<14;i++){
        const px=c.x+rnd(-22,22),py=c.y+rnd(-10,10);
        ctx.fillStyle='rgba(0,255,135,'+rnd(.15,.5)+')';
        ctx.beginPath();ctx.arc(px,py,1.6,0,7);ctx.fill();
      }
      ctx.fillStyle='rgba(0,255,135,.5)';ctx.font='10px Rajdhani';
      ctx.fillText('POBLACI\u00D3N',c.x-24,c.y+26);
    });
    bubbles.forEach(b=>{
      const grad=ctx.createRadialGradient(b.x,b.y,1,b.x,b.y,b.r);
      if(b.type==='dis'){grad.addColorStop(0,'rgba(30,144,255,.6)');grad.addColorStop(1,'rgba(178,107,255,.15)');}
      else{grad.addColorStop(0,'rgba(0,255,135,.55)');grad.addColorStop(1,'rgba(0,255,135,.12)');}
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
      ctx.strokeStyle=b.type==='dis'?'rgba(120,180,255,.8)':'rgba(0,255,135,.9)';
      ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='rgba(240,240,240,.8)';ctx.font='8px JetBrains Mono';
      ctx.fillText(b.type==='dis'?'FAKE':'TRUE',b.x-10,b.y+3);
    });
    /* mirilla */
    ctx.strokeStyle='rgba(255,59,48,.9)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(aimX,aimY,34,0,7);ctx.stroke();
    ctx.beginPath();ctx.arc(aimX,aimY,2,0,7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(aimX-46,aimY);ctx.lineTo(aimX-36,aimY);ctx.moveTo(aimX+36,aimY);ctx.lineTo(aimX+46,aimY);
    ctx.moveTo(aimX,aimY-46);ctx.lineTo(aimX,aimY-36);ctx.moveTo(aimX,aimY+36);ctx.lineTo(aimX,aimY+46);ctx.stroke();
    ctx.fillStyle='rgba(240,240,240,.9)';ctx.font='14px Rajdhani';
    ctx.fillText('PUNTOS '+score+'  \u00B7  TIEMPO '+Math.max(0,Math.ceil(time))+'s  \u00B7  PULSO '+stamina.toFixed(1)+'s',12,24);
    if(over){
      ctx.fillStyle='rgba(5,6,10,.75)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#F0F0F0';ctx.font='700 30px Orbitron';ctx.textAlign='center';
      ctx.fillText(score>=120?'MISI\u00D3N CUMPLIDA':'RONDA TERMINADA',W/2,H/2-20);
      ctx.font='16px Rajdhani';ctx.fillStyle='#8A93A6';
      ctx.fillText('Puntos: '+score+' \u00B7 Aciertos: '+got+' \u00B7 Errores: '+missed,W/2,H/2+14);
      ctx.textAlign='left';
    }
  }
})();

/* ---------- MESA DE ESTRATEGIA T\u00C1CTICA ---------- */
(function(){
  const UNIT_TYPES={
    inf:{r:6,speed:220,label:'INF',cost:1,w:1},
    tank:{r:9,speed:70,label:'TAN',cost:3,w:3.2},
    plane:{r:7,speed:300,label:'AVN',cost:2,w:2}
  };
  let units,atlas,drag,time,pct,over,objA,objB,intensity;
  function atlasLayout(){
    return[{t:'inf',x:.72,y:.3},{t:'inf',x:.78,y:.5},{t:'inf',x:.7,y:.7},{t:'tank',x:.85,y:.5},{t:'tank',x:.9,y:.35},{t:'inf',x:.65,y:.5}];
  }
  function start(){
    units=[];drag=null;time=60;over=false;
    objA={x:G2.w*.18,y:G2.h*.5};objB={x:G2.w*.82,y:G2.h*.5};
    const pz=(DATA.pulso&&DATA.pulso.zones)?DATA.pulso.zones:[];
    intensity=pz.reduce((a,z)=>a+z.total,0);
    atlas=atlasLayout().map(u=>({...u,x:u.x*G2.w,y:u.y*G2.h}));
    ['inf','inf','inf','inf','tank','plane'].forEach(t=>units.push({t,x:rnd(G2.w*.06,G2.w*.2),y:rnd(G2.h*.2,G2.h*.8)}));
  }
  function unitScore(u,isMine){
    const T=UNIT_TYPES[u.t];
    const tgt=u.t==='plane'?objB:objA;
    const d=Math.hypot(u.x-tgt.x,u.y-tgt.y);
    let s=T.w*Math.max(.2,1-d/(G2.w*.7));
    let sup=0;
    (isMine?units:atlas).forEach(o=>{if(o!==u&&Math.hypot(o.x-u.x,o.y-u.y)<90)sup+=.12;});
    return s+Math.min(1.2,sup);
  }
  function calcPct(){
    let mine=0,their=0;
    units.forEach(u=>mine+=unitScore(u,true));
    atlas.forEach(u=>their+=unitScore(u,false));
    const live=clamp(intensity/30,0,1);
    const mil=P.recruits.some(r=>r.spec==='MIL')?3:0;
    return Math.round(clamp(50+(mine-their)*7+ (live*2-1)*3+mil,4,96));
  }
  registerRoom('tactica',{section:'scr-room',
    enter(){
      Joy.enabled=false;G2.show();start();
      const sec=$('#scr-room');
      sec.innerHTML='<button class="btn sm back" id="tb">&laquo; SALIR</button>'
      +'<div style="text-align:center;pointer-events:none"><h2 class="pt">MESA DE ESTRATEGIA T\u00C1CTICA</h2>'
      +'<p class="small">Arrastra tus unidades: INF liviana y veloz \u00B7 TAN lenta y pesada (motor real) \u00B7 AVN vuela en arco al soltar. Objetivo: supera el despliegue de <b style="color:var(--red)">ATLAS</b>. Factor ACLED en vivo: <b class="num">'+intensity+'</b> se\u00F1ales.</p></div>';
      $('#tb').onclick=()=>go('sim');
      sec.style.pointerEvents='none';$('#tb').style.pointerEvents='auto';
    },
    exit(){G2.hide();$('#scr-room').style.pointerEvents='';SFX.engineStop();},
    update(dt){
      if(!G2.on)return;
      if(!over){
        time-=dt;
        if(time<=0)finish();
      }
      if(drag){
        const T=UNIT_TYPES[drag.t];
        const dx=Pointer.x-drag.x,dy=Pointer.y-drag.y;
        if(drag.t==='plane'){
          /* el avi\u00F3n vuela en arco parab\u00F3lico hacia el puntero */
          drag._arc=(drag._arc||0)+dt*2.2;
          drag.x+=dx*dt*4.5;drag.y+=dy*dt*4.5-Math.sin(Math.min(Math.PI,drag._arc))*2.2;
          if(drag._arc>Math.PI)drag._arc=Math.PI;
        }else{
          const sp=T.speed*dt;
          drag.x+=clamp(dx,-sp,sp);drag.y+=clamp(dy,-sp,sp);
        }
        if(drag.t==='tank'){SFX.engineStart();SFX.enginePitch(Math.abs(dx)/60);}
        drag.x=clamp(drag.x,20,G2.w-20);drag.y=clamp(drag.y,70,G2.h-20);
      }else SFX.engineStop();
      pct=calcPct();
      draw();
    },
    onPointerMove(){
      if(!Pointer.down||!G2.on)return;
      if(!drag){
        const hit=units.find(u=>Math.hypot(u.x-Pointer.x,u.y-Pointer.y)<16);
        if(hit)drag=hit;
      }
    },
    onPointerUp(){drag=null;SFX.engineStop();},
    onKey(e){if(e.code==='Enter'&&!over)finish();}
  });
  function finish(){
    over=true;
    const won=pct>55;
    if(won){P.duelWins++;addCoins(150,'t\u00E1ctica');addXP(90);SFX.win();FX.confetti(60);
      pushFeed('venci\u00F3 a ATLAS en la mesa t\u00E1ctica ('+pct+'%)','g');}
    else{SFX.fail();
      toast('CASI LO LOGRAS','ATLAS te gan\u00F3 por '+Math.abs(pct-55)+' puntos de despliegue. Reposici\u00F3n sugerida: acerca la INF al objetivo A.','bad',5200);
      World.bump(1,'conflicto escal\u00F3 en el mapa');}
    if(!P.bestTactic&&won){P.bestTactic=true;save();}
  }
  function drawUnit(u,col){
    const ctx=G2.ctx,T=UNIT_TYPES[u.t];
    ctx.fillStyle=col;ctx.strokeStyle='rgba(240,240,240,.5)';
    if(u.t==='tank'){ctx.fillRect(u.x-T.r,u.y-T.r,T.r*2,T.r*1.4);ctx.strokeRect(u.x-T.r,u.y-T.r,T.r*2,T.r*1.4);}
    else if(u.t==='plane'){ctx.beginPath();ctx.moveTo(u.x,u.y-T.r);ctx.lineTo(u.x+T.r,u.y+T.r);ctx.lineTo(u.x-T.r,u.y+T.r);ctx.closePath();ctx.fill();ctx.stroke();}
    else{ctx.beginPath();ctx.arc(u.x,u.y,T.r,0,7);ctx.fill();ctx.stroke();}
    ctx.fillStyle='rgba(240,240,240,.85)';ctx.font='8px Rajdhani';
    ctx.fillText(T.label,u.x-8,u.y+T.r+9);
  }
  function draw(){
    const ctx=G2.ctx,W=G2.w,H=G2.h;
    ctx.fillStyle='#0a0e18';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(30,144,255,.1)';
    for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    [objA,objB].forEach((o,i)=>{
      ctx.strokeStyle=i===0?'rgba(30,144,255,.7)':'rgba(255,59,48,.7)';
      ctx.lineWidth=2;ctx.strokeRect(o.x-30,o.y-30,60,60);
      ctx.fillStyle=i===0?'rgba(30,144,255,.12)':'rgba(255,59,48,.12)';
      ctx.fillRect(o.x-30,o.y-30,60,60);
      ctx.fillStyle=i===0?'#1E90FF':'#FF3B30';ctx.font='10px Orbitron';
      ctx.fillText(i===0?'OBJETIVO A':'OBJETIVO B',o.x-30,o.y-38);
    });
    ctx.lineWidth=1;
    atlas.forEach(u=>drawUnit(u,'#FF3B30'));
    units.forEach(u=>drawUnit(u,'#1E90FF'));
    ctx.fillStyle='rgba(240,240,240,.95)';ctx.font='700 15px Orbitron';
    ctx.fillText('VICTORIA: '+pct+'%',12,24);
    ctx.font='12px Rajdhani';ctx.fillStyle='#8A93A6';
    ctx.fillText('Tiempo: '+Math.max(0,Math.ceil(time))+'s \u00B7 '+(pct>55?'VAS GANANDO':'ATLAS VA GANANDO'),12,42);
    if(over){
      ctx.fillStyle='rgba(5,6,10,.78)';ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';ctx.fillStyle=pct>55?'#00FF87':'#FF3B30';ctx.font='700 30px Orbitron';
      ctx.fillText(pct>55?'DESPLIEGUE PERFECTO':'ATLAS GANA ESTA',W/2,H/2-16);
      ctx.fillStyle='#F0F0F0';ctx.font='15px Rajdhani';
      ctx.fillText('Probabilidad final: '+pct+'%',W/2,H/2+16);
      ctx.textAlign='left';
    }
  }
})();

/* ---------- CONSTRUCTOR DE MAPAS T\u00C1CTIL ---------- */
(function(){
  const GC=48,GR=32;
  let hmap,cities,flames,troops,borders,alliances,tool,oceanMode,simT,playing,allyFrom=null;
  function start(){
    hmap=[];for(let r=0;r<GR;r++)hmap.push(new Array(GC).fill(.3));
    cities=[];flames=[];troops=[];borders=[];alliances=[];tool='mount';oceanMode=false;playing=false;simT=0;
  }
  function paint(px,py,dir){
    const cw=G2.w/GC,chh=G2.h/GR;
    const c=Math.floor(px/cw),r=Math.floor(py/chh);
    const R=2;
    for(let dr=-R;dr<=R;dr++)for(let dc=-R;dc<=R;dc++){
      const rr=r+dr,cc=c+dc;
      if(rr<0||rr>=GR||cc<0||cc>=GC)continue;
      if(Math.hypot(dr,dc)>R)continue;
      if(oceanMode||tool==='ocean')hmap[rr][cc]=Math.min(hmap[rr][cc],.14);
      else if(tool==='mount')hmap[rr][cc]=Math.min(1,hmap[rr][cc]+.05);
      else if(tool==='valley')hmap[rr][cc]=Math.max(0,hmap[rr][cc]-.05);
    }
  }
  function nearestCity(x,y,md){let b=null,bd=md||40;cities.forEach(c=>{const d=Math.hypot(c.x-x,c.y-y);if(d<bd){bd=d;b=c;}});return b;}
  function simulate(dt){
    simT+=dt;
    troops.forEach(t=>{
      const f=flames.length?flames[t._fi=Math.min(t._fi??0,flames.length-1)]:null;
      if(f){
        const dx=f.x-t.x,dy=f.y-t.y,d=Math.hypot(dx,dy);
        if(d>6){t.x+=dx/d*40*dt;t.y+=dy/d*40*dt;}
      }
    });
    if(simT>18)playing=false;
  }
  registerRoom('builder',{section:'scr-room',
    enter(){
      Joy.enabled=false;G2.show();start();
      const sec=$('#scr-room');
      sec.innerHTML='<button class="btn sm back" id="cb2">&laquo; SALIR</button>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">'
      +['mount|MONTA\u00D1A','valley|VALLE','ocean|OC\u00C9ANO','border|FRONTERA','city|CIUDAD','flame|CONFLICTO','troop|TROPA','ally|ALIANZA','play|\u25B6 SIMULAR','reset|RESET'].map(s=>{
        const[tk,nm]=s.split('|');
        return '<button class="btn sm '+(tk==='play'?'green':tk==='flame'?'red':'')+'" data-tool="'+tk+'">'+nm+'</button>';
      }).join('')+'</div>';
      $('#cb2').onclick=()=>go('sim');
      sec.style.pointerEvents='none';
      $$('[data-tool]',sec).forEach(b=>{b.style.pointerEvents='auto';b.onclick=()=>{
        tool=b.dataset.tool;oceanMode=false;SFX.uiTap();
        if(tool==='reset'){start();toast('MAPA','Lienzo nuevo','',2000);}
        if(tool==='play'){playing=true;simT=0;
          if(!flames.length)toast('CONSTRUCTOR','Arrastra primero iconos de CONFLICTO al mapa','bad');
          else toast('SIMULACI\u00D3N','Las tropas marchan hacia los focos...','',3000);}
      };});
    },
    exit(){G2.hide();$('#scr-room').style.pointerEvents='';},
    update(dt){
      if(!G2.on)return;
      if(playing)simulate(dt);
      if(Pointer.down&&!isUI(document.elementFromPoint(Pointer.x,Pointer.y)||document.body)){
        const y=Pointer.y;
        if(tool==='mount'||tool==='valley'||tool==='ocean')paint(Pointer.x,y);
        else if(tool==='border'){borders.push({x:Pointer.x,y});if(borders.length>240)borders.shift();}
        else if(tool==='ally'&&Pointer.justDown){
          const c=nearestCity(Pointer.x,Pointer.y,60);
          if(c){
            if(allyFrom&&allyFrom!==c){alliances.push([allyFrom,c]);allyFrom=null;SFX.bell();}
            else allyFrom=c;
          }
        }
      }
      if(tool==='city'&&Pointer.justDown&&!isUI(document.elementFromPoint(Pointer.x,Pointer.y)||document.body)){
        cities.push({x:Pointer.x,y:Pointer.y,n:'C'+(cities.length+1)});SFX.pop();FX.sparks(Pointer.x,Pointer.y,8,'0,255,135');
      }
      if(tool==='flame'&&Pointer.justDown){
        flames.push({x:Pointer.x,y:Pointer.y,ph:rnd(0,6)});SFX.explosion();Shake.add(3,200);
      }
      if(tool==='troop'&&Pointer.justDown){troops.push({x:Pointer.x,y:Pointer.y});SFX.uiTap();}
      draw();
    }
  });
  function terrainColor(v){
    if(v<.15)return '#123a6b';
    if(v<.3)return '#1d4a34';
    if(v<.55)return '#2c4a2c';
    if(v<.75)return '#5a5142';
    return '#8a8a92';
  }
  function draw(){
    const ctx=G2.ctx,W=G2.w,H=G2.h;
    const cw=W/GC,chh=H/GR;
    const top=64;
    for(let r=0;r<GR;r++)for(let c=0;c<GC;c++){
      ctx.fillStyle=terrainColor(hmap[r][c]);
      ctx.fillRect(c*cw,top+r*chh,cw+1,chh+1);
    }
    ctx.strokeStyle='rgba(240,240,240,.6)';ctx.lineWidth=2;ctx.beginPath();
    borders.forEach((b,i)=>{if(i===0)ctx.moveTo(b.x,b.y);else ctx.lineTo(b.x,b.y);});ctx.stroke();ctx.lineWidth=1;
    cities.forEach(c=>{
      ctx.fillStyle='#F0F0F0';ctx.fillRect(c.x-3,c.y-5,6,8);
      ctx.fillStyle='rgba(255,194,75,.9)';ctx.font='9px Rajdhani';
      ctx.fillText(c.n,c.x+6,c.y-4);
    });
    flames.forEach(f=>{
      f.ph+=.1;
      for(let i=0;i<3;i++){
        const h=8+Math.sin(f.ph+i*2)*4;
        ctx.fillStyle=i===0?'rgba(255,59,48,.9)':i===1?'rgba(255,122,42,.8)':'rgba(255,194,75,.9)';
        ctx.beginPath();ctx.moveTo(f.x,f.y);
        ctx.quadraticCurveTo(f.x-4,f.y-h*.6,f.x+Math.sin(f.ph+i)*3,f.y-h);
        ctx.quadraticCurveTo(f.x+4,f.y-h*.6,f.x,f.y);ctx.fill();
      }
    });
    ctx.fillStyle='#1E90FF';
    troops.forEach(t=>{ctx.beginPath();ctx.arc(t.x,t.y,4,0,7);ctx.fill();
      ctx.strokeStyle='rgba(240,240,240,.6)';ctx.stroke();});
    ctx.strokeStyle='rgba(0,255,135,.8)';
    alliances.forEach(a=>{ctx.beginPath();ctx.moveTo(a[0].x,a[0].y);ctx.lineTo(a[1].x,a[1].y);ctx.stroke();});
    ctx.fillStyle='rgba(240,240,240,.9)';ctx.font='12px Rajdhani';
    ctx.fillText('HERRAMIENTA: '+tool.toUpperCase()+' \u00B7 ciudades '+cities.length+' \u00B7 conflictos '+flames.length+' \u00B7 tropas '+troops.length,10,20);
    if(tool==='ally'&&allyFrom){ctx.fillStyle='rgba(0,255,135,.9)';ctx.fillText('elige la segunda ciudad para la alianza',10,38);}
  }
})();
