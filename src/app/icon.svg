<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#241a04"/>
      <stop offset="55%" stop-color="#120c03"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="45%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#c98a10"/>
    </linearGradient>
    <linearGradient id="oro2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="55%" stop-color="#f0b428"/>
      <stop offset="100%" stop-color="#8a5c06"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="55%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#6b4705"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- fondo -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- v193.1 LA MARCA: VIGO, el centinela de Vanguard.
       Su cara vive aquí: la marca se reconoce antes de entrar. -->

  <!-- antena con baliza verde (la señal de guardia) -->
  <line x1="32" y1="9" x2="32" y2="17" stroke="#8a6410" stroke-width="2.4"/>
  <circle cx="32" cy="7.4" r="2.6" fill="#3ddc97" filter="url(#glow)"/>

  <!-- cabeza de Vigo: el hexágono de la casa -->
  <path d="M14 20 L32 13 L50 20 L50 38 L32 45 L14 38 Z" fill="url(#oro)" stroke="#ffe08a" stroke-width="1.3"/>

  <!-- visor oscuro -->
  <path d="M18 23 L46 23 L46 36 L32 40 L18 36 Z" fill="#0d0304" opacity="0.93"/>

  <!-- el ojo-radar de Vigo: iris dorado y pupila -->
  <g filter="url(#glow)">
    <circle cx="32" cy="30.5" r="6.6" fill="url(#iris)"/>
    <circle cx="32" cy="30.5" r="2.8" fill="#050001"/>
    <circle cx="30.2" cy="28.6" r="1.2" fill="#fff6e0" opacity="0.95"/>
  </g>

  <!-- arco de barrido del radar alrededor del ojo -->
  <path d="M32 20.8 A9.7 9.7 0 0 1 41.7 30.5" fill="none" stroke="#3ddc97" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- hombros con las luces de estado (roja y verde) -->
  <rect x="12" y="46" width="40" height="6" rx="3" fill="url(#oro2)" opacity="0.95"/>
  <circle cx="17" cy="49" r="1.6" fill="#ff3b30"/>
  <circle cx="47" cy="49" r="1.6" fill="#3ddc97"/>

  <!-- pecho con la V de Vanguard -->
  <path d="M24 54 L32 62 L40 54" fill="none" stroke="#f5c542" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- estrella norte de la vanguardia (sello de la casa) -->
  <g fill="url(#oro)" filter="url(#glow)">
    <path d="M53.5 3.2 L54.5 6.6 L57.8 5.5 L55.6 8.3 L57.8 11 L54.5 9.9 L53.5 13.3 L52.5 9.9 L49.2 11 L51.4 8.3 L49.2 5.5 L52.5 6.6 Z" transform="scale(0.92) translate(4.5 0.4)"/>
  </g>

  <!-- marco -->
  <rect x="1.2" y="1.2" width="61.6" height="61.6" rx="12.8" fill="none" stroke="#e8b62a" stroke-opacity="0.45" stroke-width="1.6"/>
</svg>
