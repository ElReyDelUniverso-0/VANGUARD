<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#241a04"/>
      <stop offset="55%" stop-color="#120c03"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="45%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#c98a10"/>
    </linearGradient>
    <linearGradient id="oro2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2c0"/>
      <stop offset="60%" stop-color="#e8b62a"/>
      <stop offset="100%" stop-color="#9a6d08"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="55%" stop-color="#f0b428"/>
      <stop offset="100%" stop-color="#8a5c06"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- fondo -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- órbita del satélite: el tiempo y la vigilancia total -->
  <ellipse cx="32" cy="33" rx="27" ry="11.5" fill="none" stroke="#8a6410" stroke-width="1.3" opacity="0.65" transform="rotate(-24 32 33)"/>
  <circle cx="54.2" cy="26.4" r="2.1" fill="#ffe08a" filter="url(#glow)"/>

  <!-- anillo exterior dorado -->
  <circle cx="32" cy="33" r="24.5" fill="none" stroke="url(#oro2)" stroke-width="2" opacity="0.9"/>

  <!-- el mundo: globo con meridianos y paralelos -->
  <g stroke="url(#oro)" stroke-width="1.5" fill="none" opacity="0.95">
    <circle cx="32" cy="33" r="17.5" fill="#0e0a04" stroke-width="2"/>
    <ellipse cx="32" cy="33" rx="8.2" ry="17.5" opacity="0.8"/>
    <path d="M14.5 33 H49.5" opacity="0.8"/>
    <path d="M17.5 25.5 Q32 22.5 46.5 25.5" opacity="0.55"/>
    <path d="M17.5 40.5 Q32 43.5 46.5 40.5" opacity="0.55"/>
  </g>

  <!-- continentes sugeridos (masas doradas sutiles) -->
  <g fill="#e8b62a" opacity="0.30">
    <path d="M22 27 Q26 24 30 26 Q29 30 25 31 Q21 30 22 27 Z"/>
    <path d="M36 38 Q41 36 43 40 Q41 44 37 43 Q34 41 36 38 Z"/>
  </g>

  <!-- la inteligencia: el ojo del mundo integrado en el globo -->
  <g filter="url(#glow)">
    <path d="M20.5 33 Q32 24.5 43.5 33 Q32 41.5 20.5 33 Z" fill="#0d0304" stroke="url(#oro2)" stroke-width="1.8"/>
    <circle cx="32" cy="33" r="6.2" fill="url(#iris)"/>
    <circle cx="32" cy="33" r="2.6" fill="#050001"/>
    <circle cx="29.9" cy="30.9" r="1.2" fill="#fff6e0" opacity="0.95"/>
  </g>

  <!-- la vanguardia: estrella norte que marca el puesto de avanzada -->
  <g fill="url(#oro)" filter="url(#glow)">
    <path d="M32 2.6 L33.4 7.8 L38.4 6.2 L35.2 10.3 L38.4 14.4 L33.4 12.8 L32 18 L30.6 12.8 L25.6 14.4 L28.8 10.3 L25.6 6.2 L30.6 7.8 Z"/>
  </g>

  <!-- marco -->
  <rect x="1.2" y="1.2" width="61.6" height="61.6" rx="12.8" fill="none" stroke="#e8b62a" stroke-opacity="0.45" stroke-width="1.6"/>
</svg>
