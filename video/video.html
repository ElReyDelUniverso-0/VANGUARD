<style>

#tag{left:0;right:0;top:508px;text-align:center;font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:46px;letter-spacing:.12em;opacity:0}
#foot{left:0;right:0;top:606px;text-align:center;font-size:15px;font-weight:700;letter-spacing:.3em;color:#8b93a7;opacity:0}

#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff,rgba(255,255,255,.75) 55%,rgba(255,255,255,0));opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style>
</head>
<body>

<script>
'use strict';
const $=id=>document.getElementById(id);
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const RAR={comun:{n:'COMÚN',c:'#9aa3b2'},rara:{n:'RARA',c:'#4ea3ff'},epica:{n:'ÉPICA',c:'#b46bff'},legendaria:{n:'LEGENDARIA',c:'#ffc63f'},mitica:{n:'MÍTICA 1/1',c:'#ff5ea8'}};
const DB=[
['A1',0,'comun','Cuchilla de Oxidio'],['A2',0,'comun','Daga del Vigía'],['A3',0,'comun','Bastón de Señales'],['A4',0,'comun','Hacha Minera K-7'],['A5',0,'comun','Lanza de Cerco'],['A6',0,'comun','Filo Recustodio'],['A7',0,'rara','Espada Aurora'],['A8',0,'rara','Guja del Alba'],['A9',0,'rara','Martillo Cismar'],['A10',0,'epica','Fauces del Eclipse'],['A11',0,'epica','Cimitarra Nebular'],['A12',0,'legendaria','Excalibur VANGUARD'],['A13',0,'mitica','LA ESPADA DEL UNIVERSO'],
['G1',1,'comun','Escaramuza del Puerto'],['G2',1,'comun','Niebla en el Frente'],['G3',1,'comun','Trinchera 12'],['G4',1,'comun','Retirada al Alba'],['G5',1,'comun','Puesto de Vigilancia'],['G6',1,'comun','Embestida Menor'],['G7',1,'rara','Asedio de Hierro'],['G8',1,'rara','Carga del Cometa'],['G9',1,'rara','Noche de Fuego'],['G10',1,'epica','Colapso del Coloso'],['G11',1,'epica','Tormenta de Acero'],['G12',1,'legendaria','LA CAÍDA DEL TITÁN'],['G13',1,'mitica','EL ÚLTIMO AMANECER'],
['P1',2,'comun','Recluta Sin Nombre'],['P2',2,'comun','Centinela Ekko'],['P3',2,'comun','Exploradora Vas'],['P4',2,'comun','Ingeniero Brom'],['P5',2,'comun','Herald Menel'],['P6',2,'comun','Sombra Vagabunda'],['P7',2,'rara','Capitana Ryn'],['P8',2,'rara','Oráculo Javiel'],['P9',2,'rara','Señor de Guerra Oto'],['P10',2,'epica','La Viuda Estelar'],['P11',2,'epica','Archivante del Caos'],['P12',2,'legendaria','EL REY DEL UNIVERSO'],['P13',2,'mitica','EL ELEGIDO DEL UNIVERSO'],
['S1',3,'comun','Runa de Tránsito'],['S2',3,'comun','Sello del Puerto'],['S3',3,'comun','Marca del Vigía'],['S4',3,'comun','Glifo Menor'],['S5',3,'comun','Divisa del Campamento'],['S6',3,'comun','Tótem de Ruta'],['S7',3,'rara','Emblema del Cometa'],['S8',3,'rara','Sello Cismar'],['S9',3,'rara','Ojo del Oráculo'],['S10',3,'epica','Corona del Vacío'],['S11',3,'epica','Llave del Universo'],['S12',3,'legendaria','MONOLITO VANGUARD'],['S13',3,'mitica','EL SÍMBOLO PRIMERO']];
const byId={};DB.forEach(d=>byId[d[0]]={id:d[0],serie:d[1],rar:d[2],nombre:d[3]});
function cardDefs(uid,pal){return `<radialGradient id="${uid}bg" cx="50%" cy="28%" r="90%"><stop offset="0" stop-color="${pal}" stop-opacity=".22"/><stop offset=".55" stop-color="#0a0d18" stop-opacity=".9"/><stop offset="1" stop-color="#05060c"/></radialGradient><linearGradient id="${uid}ar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="${pal}"/><stop offset="1" stop-color="${pal}" stop-opacity=".55"/></linearGradient><filter id="${uid}g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`}
function cardBG(uid,pal,r){let s=`<rect width="300" height="400" fill="url(#${uid}bg)"/>`;for(let i=0;i<26;i++){s+=`<circle cx="${(r()*300).toFixed(1)}" cy="${(r()*400).toFixed(1)}" r="${(r()*1.3+.3).toFixed(2)}" fill="#fff" opacity="${(r()*.5+.1).toFixed(2)}"/>`}s+=`<path d="M18 34 V18 H34 M266 18 H282 V34 M282 366 V382 H266 M34 382 H18 V366" stroke="${pal}" stroke-opacity=".8" stroke-width="2" fill="none"/>`;return s}
function genArma(r,pal,uid){const cx=150,g=`url(#${uid}ar)`,f=`url(#${uid}g)`;let s=`<circle cx="${cx}" cy="195" r="${100+r()*30}" fill="none" stroke="${pal}" stroke-opacity=".3" stroke-dasharray="${(4+r()*8).toFixed(1)} ${(8+r()*10).toFixed(1)}" stroke-width="1.5"/>`;const t=Math.floor(r()*5),w=11+r()*9,L=118+r()*46,by=96+L;
if(t===0){s+=`<g filter="${f}"><polygon points="${cx},62 ${cx+w},96 ${cx+w-3},${by} ${cx},${by+16} ${cx-w+3},${by} ${cx-w},96" fill="${g}"/></g><line x1="${cx}" y1="80" x2="${cx}" y2="${by+8}" stroke="#05060a" stroke-opacity=".55" stroke-width="2.5"/><rect x="${cx-34}" y="${by+16}" width="68" height="10" rx="4" fill="${pal}"/><rect x="${cx-7}" y="${by+26}" width="14" height="${34+r()*14}" rx="5" fill="${g}"/><circle cx="${cx}" cy="${by+72}" r="8" fill="${pal}" filter="${f}"/>`;}
else if(t===1){const sy=90,sh=150+r()*40,bw=44+r()*22,bh=60+r()*30,yy=sy+18;s+=`<g filter="${f}"><rect x="${cx-5}" y="${sy}" width="10" height="${sh}" rx="4" fill="${g}"/></g><g filter="${f}"><path d="M${cx+4} ${yy} q${bw} ${-bh/3} ${bw} ${bh/2} q${-bw/2} ${bh/4} ${-bw} ${bh/3} Z" fill="${g}"/></g><g filter="${f}"><path d="M${cx-4} ${yy} q${-bw} ${-bh/3} ${-bw} ${bh/2} q${bw/2} ${bh/4} ${bw} ${bh/3} Z" fill="${g}"/></g><circle cx="${cx}" cy="${sy+sh-14}" r="9" fill="${pal}" filter="${f}"/>`;}
else if(t===2){const L2=190+r()*60,tp=50;s+=`<g filter="${f}"><polygon points="${cx},${tp} ${cx+12},${tp+42} ${cx+5},${tp+50} ${cx+5},${tp+50+L2} ${cx-5},${tp+50+L2} ${cx-5},${tp+50} ${cx-12},${tp+42}" fill="${g}"/></g><g filter="${f}"><polygon points="${cx-30},${tp+58} ${cx-6},${tp+66} ${cx-6},${tp+84} ${cx-30},${tp+70}" fill="${pal}" opacity=".85"/></g><g filter="${f}"><polygon points="${cx+30},${tp+58} ${cx+6},${tp+66} ${cx+6},${tp+84} ${cx+30},${tp+70}" fill="${pal}" opacity=".85"/></g>`;}
else if(t===3){const ty=78;s+=`<g filter="${f}"><rect x="${cx-5}" y="${ty}" width="10" height="${200+r()*30}" rx="4" fill="${g}"/></g><g filter="${f}"><path d="M${cx-5} ${ty+12} q${-95} ${-8} ${-118} ${86} q${70} ${-34} ${118} ${-28} Z" fill="${g}"/></g><circle cx="${cx}" cy="${ty+196}" r="8" fill="${pal}" filter="${f}"/>`;}
else{const hy=92;s+=`<g filter="${f}"><rect x="${cx-46}" y="${hy}" width="92" height="64" rx="10" fill="${g}"/></g><rect x="${cx-46}" y="${hy+18}" width="92" height="6" fill="#05060a" opacity=".5"/><g filter="${f}"><rect x="${cx-6}" y="${hy+64}" width="12" height="${120+r()*30}" fill="${g}"/></g><circle cx="${cx}" cy="${hy+32}" r="12" fill="#fff" opacity=".9" filter="${f}"/>`;}
for(let i=0;i<5;i++){s+=`<circle cx="${(40+r()*220)|0}" cy="${(60+r()*280)|0}" r="${(1+r()*2).toFixed(1)}" fill="${pal}" opacity=".8"/>`}return s}
function genGuerra(r,pal,uid){const f=`url(#${uid}g)`;let s='';const ex=(60+r()*180)|0,ey=(60+r()*80)|0,er=(28+r()*26)|0;s+=`<circle cx="${ex}" cy="${ey}" r="${er}" fill="none" stroke="${pal}" stroke-width="3" opacity=".9" filter="${f}"/><circle cx="${ex}" cy="${ey}" r="${(er*.55).toFixed(1)}" fill="#05060a" opacity=".9"/>`;for(let i=0;i<3;i++){const bx=(r()*260)|0,bw2=(24+r()*50)|0;s+=`<polygon points="${bx},0 ${bx+bw2},0 ${bx+bw2+50},250 ${bx+20},250" fill="${pal}" opacity=".07"/>`;}
const mk=(base,amp,col,op)=>{let p=`M0 ${base}`;for(let x=0;x<=300;x+=25){p+=` L${x} ${(base-r()*amp)|0}`}p+=` L300 400 L0 400 Z`;return `<path d="${p}" fill="${col}" opacity="${op}"/>`};s+=mk(250,70,'#0b0f1c',.95)+mk(300,50,'#070a12',1);
const exx=(40+r()*220)|0,exy=(245+r()*40)|0,sp=8+(r()*5|0),R1=16+r()*18,R2=R1*.45;let pts=[];for(let i=0;i<sp*2;i++){const a=Math.PI*i/sp,rr=i%2?R2:R1;pts.push([(exx+Math.cos(a)*rr),(exy+Math.sin(a)*rr)])}
s+=`<polygon points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="${pal}" filter="${f}" opacity=".95"/><circle cx="${exx}" cy="${exy}" r="${(R1*1.7).toFixed(1)}" fill="${pal}" opacity=".18"/>`;
for(let row=0;row<2;row++){const y=318+row*22,n=8+(r()*4|0);for(let i=0;i<n;i++){const x=(i+r()*.6)*(300/n)+r()*8,h=10+r()*9+row*3;s+=`<polygon points="${x.toFixed(1)},${(y-h).toFixed(1)} ${(x+5).toFixed(1)},${y} ${(x-5).toFixed(1)},${y}" fill="#e8ecf5" opacity="${(.5-row*.2).toFixed(2)}"/>`}}
for(let i=0;i<2;i++){const x=(30+r()*240)|0;s+=`<line x1="${x}" y1="270" x2="${x}" y2="330" stroke="#cfd6e4" stroke-width="2.5"/><polygon points="${x},272 ${x+(r()<.5?-26:26)},280 ${x},290" fill="${pal}" filter="${f}"/>`}return s}
function genPersonaje(r,pal,uid){const f=`url(#${uid}g)`,cx=150,cy=185;let s='';const n=2+(r()*2|0);for(let i=0;i<n;i++){s+=`<circle cx="${cx}" cy="${cy}" r="${(66+i*22+r()*8).toFixed(1)}" fill="none" stroke="${pal}" stroke-opacity="${(.35-i*.09).toFixed(2)}" stroke-width="1.5"/>`}
s+=`<g filter="${f}"><path d="M${cx-98} 330 q${29} -46 ${49} -52 q${49} 6 ${49} 52 l-14 26 q-${84} -26 -168 0 Z" fill="${pal}" opacity=".9"/></g>`;
const v=Math.floor(r()*4);if(v===0||v===2){s+=`<g filter="${f}"><path d="M${cx-46} ${cy+6} a46 46 0 0 1 92 0 l-6 40 h-80 Z" fill="${pal}"/></g>`}else{s+=`<g filter="${f}"><path d="M${cx} ${cy-58} q52 8 50 58 q-2 34 -14 48 h-72 q-12 -14 -14 -48 q-2 -50 50 -58 Z" fill="${pal}"/></g><path d="M${cx-26} ${cy-6} q26 -20 52 0 q-24 44 -52 0 Z" fill="#05060a" opacity=".92"/>`}
if(v<2||v===3){s+=`<rect x="${cx-34}" y="${cy-6}" width="68" height="12" rx="6" fill="#05060a"/>`;const e1=cx-16+r()*10,e2=cx+16-r()*10;s+=`<circle cx="${e1.toFixed(1)}" cy="${cy}" r="4.5" fill="#fff" filter="${f}"/><circle cx="${e2.toFixed(1)}" cy="${cy}" r="4.5" fill="#fff" filter="${f}"/>`}else{s+=`<path d="M${cx-30} ${cy-12} h60 M${cx-30} ${cy+6} h60" stroke="#05060a" stroke-width="4" opacity=".8"/><circle cx="${cx}" cy="${cy}" r="5" fill="#fff" filter="${f}"/>`}
if(r()<.5){s+=`<g filter="${f}"><polygon points="${cx-20},${cy-58} ${cx},${cy-86} ${cx+20},${cy-58} ${cx},${cy-66}" fill="${pal}"/></g>`}
for(let i=0;i<7;i++){s+=`<circle cx="${(30+r()*240)|0}" cy="${(60+r()*260)|0}" r="${(1+r()*2).toFixed(1)}" fill="${pal}" opacity=".85"/>`}return s}
function genSimbolo(r,pal,uid){const f=`url(#${uid}g)`,cx=150,cy=195;let s='';const R1=(98+r()*24)|0;s+=`<circle cx="${cx}" cy="${cy}" r="${R1}" fill="none" stroke="${pal}" stroke-width="2" opacity=".8"/><circle cx="${cx}" cy="${cy}" r="${R1-10}" fill="none" stroke="${pal}" stroke-width="1" opacity=".4" stroke-dasharray="3 7"/>`;
const tk=8+(r()*8|0);for(let i=0;i<tk;i++){const a=2*Math.PI*i/tk;s+=`<line x1="${(cx+Math.cos(a)*(R1+6)).toFixed(1)}" y1="${(cy+Math.sin(a)*(R1+6)).toFixed(1)}" x2="${(cx+Math.cos(a)*(R1+16)).toFixed(1)}" y2="${(cy+Math.sin(a)*(R1+16)).toFixed(1)}" stroke="${pal}" stroke-width="2" opacity=".85"/>`}
const sd=3+(r()*4|0),R2=R1*.62,rot=r()*Math.PI;let pts=[];for(let i=0;i<sd;i++){const a=rot+2*Math.PI*i/sd;pts.push([(cx+Math.cos(a)*R2),(cy+Math.sin(a)*R2)])}
s+=`<polygon points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${pal}" stroke-width="2.5" filter="${f}"/>`;
for(let i=0;i<sd;i++){const a=rot+2*Math.PI*i/sd;s+=`<line x1="${cx}" y1="${cy}" x2="${(cx+Math.cos(a)*R1).toFixed(1)}" y2="${(cy+Math.sin(a)*R1).toFixed(1)}" stroke="${pal}" stroke-opacity=".5" stroke-width="1.5"/>`}
const g=Math.floor(r()*3);if(g===0){s+=`<ellipse cx="${cx}" cy="${cy}" rx="34" ry="18" fill="#05060a" stroke="${pal}" stroke-width="2" filter="${f}"/><circle cx="${cx}" cy="${cy}" r="9" fill="${pal}" filter="${f}"/>`}else if(g===1){let p2=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?9:26;p2.push([(cx+Math.cos(a)*rr),(cy+Math.sin(a)*rr)])}s+=`<polygon points="${p2.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="${pal}" filter="${f}"/>`}else{s+=`<circle cx="${cx}" cy="${cy}" r="20" fill="none" stroke="${pal}" stroke-width="3" filter="${f}"/><circle cx="${cx}" cy="${cy}" r="9" fill="${pal}"/><circle cx="${cx}" cy="${cy}" r="30" fill="none" stroke="${pal}" stroke-dasharray="2 6" opacity=".8"/>`}
for(let i=0;i<3;i++){const a=r()*2*Math.PI;s+=`<circle cx="${(cx+Math.cos(a)*R1).toFixed(1)}" cy="${(cy+Math.sin(a)*R1).toFixed(1)}" r="3.5" fill="${pal}" filter="${f}"/>`}return s}
function artFor(d,serial){const seed=hashStr(d.id+'·'+(d.rar==='mitica'?'UNO':('S'+serial)));const r=mulberry32(seed);const uid='u'+seed.toString(36);const pal=RAR[d.rar].c;const gens=[genArma,genGuerra,genPersonaje,genSimbolo];return `<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"><defs>${cardDefs(uid,pal)}</defs>${cardBG(uid,pal,r)}${gens[d.serie](r,pal,uid)}</svg>`}
function cardInner(d,serial){const rar=RAR[d.rar];const stx=d.rar==='mitica'?'1/1':'#'+String(serial).padStart(4,'0');return `<div class="cserial">${stx}</div><div class="cart">${artFor(d,serial)}</div><div class="cname">${d.nombre}</div><div class="crar" style="color:${rar.c}">${rar.n}</div>`}
function packSVG(){return `<svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="pkg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd75e"/><stop offset="1" stop-color="#7a5410"/></linearGradient></defs><rect x="30" y="20" width="140" height="220" rx="14" fill="url(#pkg)"/><rect x="30" y="20" width="140" height="220" rx="14" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2"/><polygon points="100,70 146,100 130,160 70,160 54,100" fill="#05060a" opacity=".85"/><polygon points="100,84 132,104 121,146 79,146 68,104" fill="none" stroke="#ffd75e" stroke-width="3"/><text x="100" y="205" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="19" fill="#05060a">VANGUARD</text></svg>`}
// ===== CONSTRUCCIÓN DE ESCENAS =====
const seg=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
const ease=x=>1-Math.pow(1-x,3);
(function(){const r=mulberry32(42);let h='';for(let i=0;i<150;i++){h+=`<i style="left:${(r()*100).toFixed(2)}%;top:${(r()*100).toFixed(2)}%;width:${(r()*1.8+.6).toFixed(2)}px;height:${(r()*1.8+.6).toFixed(2)}px"></i>`}$('stars').innerHTML=h})();
const starEls=[...document.querySelectorAll('#stars i')];
(function(){$('logo').innerHTML='VANGUARD'.split('').map(ch=>`<span>${ch}</span>`).join('')})();
const letters=[...document.querySelectorAll('#logo span')];
const SERIES=[
 {n:'ARMAS',sub:'13 FICHAS · 1 MÍTICA 1/1',cards:[['A7',4],['A10',7],['A12',12]]},
 {n:'GUERRAS',sub:'13 FICHAS · 1 MÍTICA 1/1',cards:[['G3',9],['G10',15],['G12',21]]},
 {n:'PERSONAJES',sub:'13 FICHAS · 1 MÍTICA 1/1',cards:[['P7',6],['P11',18],['P12',27]]},
 {n:'SÍMBOLOS',sub:'13 FICHAS · 1 MÍTICA 1/1',cards:[['S7',11],['S10',14],['S12',33]]}];
const S2B=SERIES.map(S=>{
 const b=document.createElement('div');b.className='abs';b.style.cssText='left:60px;top:0;width:1160px;height:720px;visibility:hidden';$('s2').appendChild(b);
 const name=document.createElement('div');name.className='abs sername';name.textContent=S.n;name.style.cssText+=';left:0;top:300px;font-size:64px';b.appendChild(name);
 const sub=document.createElement('div');sub.className='abs sersub';sub.textContent=S.sub;sub.style.cssText+=';left:6px;top:396px';b.appendChild(sub);
 const rots=[-7,2,6];
 const cards=S.cards.map(([id,ser],j)=>{const c=document.createElement('div');c.className='card r-'+byId[id].rar;c.innerHTML=cardInner(byId[id],ser);c.style.cssText+=`;left:${660+j*175}px;top:${210+j*16}px;width:166px;height:230px;opacity:0`;b.appendChild(c);return c});
 return {b,name,sub,cards,rots};});
$('pack').innerHTML=packSVG();
const FLIPS=[['G8',5],['S11',19],['A12',12]];
const flipEls=FLIPS.map(([id,ser],j)=>{const c=document.createElement('div');c.className='card r-'+byId[id].rar;c.innerHTML=cardInner(byId[id],ser);c.style.cssText=`left:${215+j*300}px;top:150px;width:250px;height:346px;opacity:0`;$('row3').appendChild(c);return c});
$('mcard').innerHTML=`<div class="card r-mitica" style="left:0;top:0;width:296px;height:411px">${cardInner(byId.A13,1)}</div>`;
const orb=[];for(let i=0;i<22;i++){const d=document.createElement('div');d.className='orbdot';$('morbit').appendChild(d);orb.push(d)}
const VIT=[['P12',27],['A13',1],['G12',21]];
const vitEls=VIT.map(([id,ser],j)=>{const c=document.createElement('div');c.className='card r-'+byId[id].rar;c.innerHTML=cardInner(byId[id],ser);c.style.cssText=`left:${280+j*260}px;top:150px;width:230px;height:318px;opacity:0`;$('vrow').appendChild(c);return c});

// ===== TIMELINE =====
window.renderFrame=function(t){
 $('bgglow').style.opacity=(0.28+0.5*Math.max(0,1-Math.abs(t-15.7)/1.3)).toFixed(3);
 starEls.forEach((s,i)=>{s.style.opacity=(0.15+0.45*(0.5+0.5*Math.sin(2.6*t+i*1.7))).toFixed(3)});
 const s1o=seg(t,0.0,0.18)*(1-seg(t,3.3,3.85));
 $('s1').style.opacity=s1o.toFixed(3);$('s1').style.visibility=s1o>0.001?'visible':'hidden';
 letters.forEach((sp,i)=>{const e=ease(seg(t,0.25+i*0.22,0.55+i*0.22));sp.style.opacity=e.toFixed(3);sp.style.transform=`translateY(${((1-e)*46).toFixed(1)}px) scale(${(0.6+0.4*e).toFixed(3)})`});
 $('s1line').style.width=(360*ease(seg(t,1.9,2.55))).toFixed(1)+'px';
 $('s1sub').style.opacity=(seg(t,2.2,2.8)*(1-seg(t,3.3,3.85))).toFixed(3);
 const S2T=[3.7,5.32,6.94,8.56];
 S2B.forEach((B,k)=>{const sk=S2T[k];const nxt=k<3?S2T[k+1]:10.15;
  const o=seg(t,sk-0.05,sk+0.35)*(1-seg(t,nxt+0.25,nxt+0.55));
  if(o<=0.001){B.b.style.visibility='hidden';return}
  B.b.style.visibility='visible';B.b.style.opacity=o.toFixed(3);
  const e=ease(seg(t,sk,sk+0.5));
  B.name.style.transform=`translateX(${((1-e)*-90).toFixed(1)}px)`;B.name.style.opacity=e.toFixed(3);
  B.sub.style.transform=`translateX(${((1-e)*-60).toFixed(1)}px)`;B.sub.style.opacity=seg(t,sk+0.15,sk+0.6).toFixed(3);
  B.cards.forEach((c,j)=>{const ej=ease(seg(t,sk+0.1+0.14*j,sk+0.62+0.14*j));
   c.style.opacity=ej.toFixed(3);
   c.style.transform=`translateX(${((1-ej)*240).toFixed(1)}px) translateY(${(6*Math.sin(2.1*t+j*1.3+k)).toFixed(2)}px) rotate(${B.rots[j]}deg)`;});});
 const s3o=t>=10.05?(1-seg(t,14.75,15.15)):0;
 $('s3').style.opacity=s3o.toFixed(3);$('s3').style.visibility=s3o>0.001?'visible':'hidden';
 if(s3o>0.001){
  const shakeE=seg(t,10.3,10.85);const burst=seg(t,10.85,10.95);
  const shake=(shakeE>0&&burst<=0)?(10*Math.sin(52*t)):0;
  const packScale=1+0.15*shakeE-0.9*ease(burst);
  const pk=$('pack');
  pk.style.opacity=(1-ease(burst)).toFixed(3);
  pk.style.transform=`translate(${shake.toFixed(2)}px,${(6*Math.sin(3*t)).toFixed(2)}px) scale(${packScale.toFixed(3)})`;
  $('s3hint').style.opacity=(seg(t,10.1,10.3)*(1-seg(t,10.85,11.0))).toFixed(3);
  FLIPS.forEach((_,j)=>{const tj=11.15+j*1.2;const e=ease(seg(t,tj,tj+0.55));const c=flipEls[j];
   c.style.opacity=e.toFixed(3);
   c.style.transform=`translateY(${((1-e)*70).toFixed(1)}px) scale(${(0.85+0.15*e).toFixed(3)})`;
   const glow=1+0.5*Math.max(0,1-Math.abs(t-(tj+0.55))/0.5);
   c.style.filter=e>0.9?`brightness(${glow.toFixed(2)})`:'none';});
  $('m1i').style.width=(100*ease(seg(t,11.0,14.6))).toFixed(1)+'%';
  $('m2i').style.width=(66*ease(seg(t,11.0,14.6))).toFixed(1)+'%';
 }
 const f1=Math.max(0,1-Math.abs(t-10.9)/0.35)*0.55;
 const f2=Math.max(0,1-Math.abs(t-15.25)/0.55);
 $('flash').style.opacity=Math.max(f1,f2).toFixed(3);
 const s4o=seg(t,15.05,15.35)*(1-seg(t,19.0,19.45));
 $('s4').style.opacity=s4o.toFixed(3);$('s4').style.visibility=s4o>0.001?'visible':'hidden';
 if(s4o>0.001){
  const e=ease(seg(t,15.2,16.0));
  $('mcard').style.transform=`scale(${(0.72+0.28*e).toFixed(3)}) rotateY(${(-12*Math.sin((t-15.2)*0.8)).toFixed(2)}deg)`;
  $('mtxt1').style.opacity=seg(t,15.35,15.75).toFixed(3);
  $('mtxt1').style.backgroundPosition=((t*130)%300).toFixed(1)+'% 0';
  $('mtxt2').style.opacity=seg(t,15.9,16.5).toFixed(3);
  orb.forEach((d,i)=>{const a=t*0.85+i*(2*Math.PI/22);const x=450+Math.cos(a)*430,y=250+Math.sin(a)*215;
   d.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
   d.style.opacity=(0.25+0.6*seg(t,15.3,15.9)).toFixed(2)});}
 const s5o=seg(t,19.2,19.5);
 $('s5').style.opacity=s5o.toFixed(3);$('s5').style.visibility=s5o>0.001?'visible':'hidden';
 if(s5o>0.001){
  vitEls.forEach((c,j)=>{const ej=ease(seg(t,19.3+j*0.15,19.85+j*0.15));c.style.opacity=ej.toFixed(3);
   c.style.transform=`translateY(${((1-ej)*90).toFixed(1)}px) rotate(${[-4,0,4][j]}deg)`});
  const te=ease(seg(t,19.6,20.2));
  $('tag').style.opacity=te.toFixed(3);$('tag').style.letterSpacing=(0.34-0.22*te).toFixed(3)+'em';
  $('foot').style.opacity=seg(t,20.2,20.7).toFixed(3);}
 $('fade').style.opacity=seg(t,22.15,22.98).toFixed(3);
};
renderFrame(0);
</script>
</body>
</html>
